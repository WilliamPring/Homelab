# inventory.ini — the list of machines Ansible manages, grouped by role.
#
# This is the ONE file you must edit before running. Everything else is generic.
#
# Format (INI style — the simplest inventory format):
#   <friendly-name>  ansible_host=<ip-or-dns>  ansible_user=<ssh-user>
#
#   friendly-name : what Ansible calls the host (aka `inventory_hostname`)
#   ansible_host  : the IP/hostname Ansible actually SSHes to
#   ansible_user  : the SSH login user (must be able to sudo)

# ─── CONTROL PLANE ────────────────────────────────────────────────────────────
# Exactly one host here for now. This becomes the k3s "server" (control plane).
# For your VM test, point ansible_host at the VM's IP and set the SSH user.
[master]
homelab-master ansible_host=192.168.68.94 ansible_user=sysadmin

# ─── WORKERS ──────────────────────────────────────────────────────────────────
# Empty for now = single-node cluster (the master runs everything).
# To add a worker later, uncomment and edit a line like this:
# homelab-worker-1 ansible_host=192.168.68.201 ansible_user=debian
[workers]
homelab-workers ansible_host=192.168.68.97 ansible_user=sysadmin

# ─── GROUP-OF-GROUPS ──────────────────────────────────────────────────────────
# A convenience group so "do this on every k3s node" targets master + workers.
# `:children` means "this group is made of other groups."
[k3s_cluster:children]
master
workers
