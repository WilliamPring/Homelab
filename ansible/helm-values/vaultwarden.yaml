# Helm values for Vaultwarden (guerzon/vaultwarden chart).
# Edit Vaultwarden's config HERE — clean YAML, referenced from vars/helm_releases.yml.

image:
  repository: vaultwarden/server

# External Postgres (LXC @ 192.168.68.7) — the DB (your passwords) lives OUTSIDE the
# cluster, so it survives cluster rebuilds and gets backed up to Backblaze B2.
#
# The guerzon chart's `existingSecretKey` holds the FULL DATABASE URI (not just the
# password). The playbook (Play 5) BUILDS that URI from vaultwarden_db_password
# (vars/secrets.local.yaml) into the 'vaultwarden-db' Secret, key 'uri' — so the
# password stays out of git.
database:
  type: postgresql
  existingSecret: "vaultwarden-db"
  existingSecretKey: "uri"        # this key holds the full postgresql:// connection URI

# Let you create your account on first use. Set false AFTER you've signed up.
signupsAllowed: true

# The external URL Vaultwarden is served at (behind the Gateway/HTTPS). Needed so links,
# WebSocket, and WebAuthn work correctly through the reverse proxy.
domain: "https://vault.williampring.ca"

# ClusterIP + port-forward: the Vaultwarden web vault needs a secure context (HTTPS
# or localhost), so plain-http NodePort can't log in anyway. Reach it with:
#   sudo k3s kubectl -n apps port-forward svc/vaultwarden 8080:80  → http://localhost:8080
# (Switch to an IngressRoute + TLS later for real hostname access.)
service:
  type: ClusterIP

storage:
  data:
    name: "vaultwarden-data"      # names the PVC + the volumeMount (must be set)
    path: "/data"                 # mount path inside the container
    size: "2Gi"
    class: ""                     # "" = k3s default (local-path)
    accessMode: "ReadWriteOnce"   # local-path only supports RWO (NOT ReadWriteMany)
