# Helm values for Immich (immich-app/immich-charts — bjw-s common-library based).
#
# ⚠️ STRUCTURE MATTERS for this chart:
#   env  → controllers.main.containers.main.env   (NOT a top-level env:)
#   svc  → service.main
#   lib  → immich.persistence.library
# Redis auto-wires to <release>-valkey when valkey.enabled: true.

# Pin ALL Immich pods to the labeled 32GB worker (heavy: ML + storage).
defaultPodOptions:
  nodeSelector:
    immich-node: "true"

# Photo library → the pre-created NFS-backed PVC (immich-prereqs.yaml).
immich:
  persistence:
    library:
      existingClaim: immich-library

# Let the chart deploy + auto-wire Valkey (Redis). REDIS_HOSTNAME → immich-valkey.
valkey:
  enabled: true

# Environment — connect to the EXTERNAL vector Postgres (immich-prereqs.yaml).
# MUST live here (controllers.main.containers.main.env) for this chart to apply it.
controllers:
  main:
    containers:
      main:
        env:
          DB_HOSTNAME: immich-postgres
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: password

# Expose the web/API on NodePort for now (TLS Ingress later).
service:
  main:
    type: NodePort
    ports:
      http:
        nodePort: 30041
