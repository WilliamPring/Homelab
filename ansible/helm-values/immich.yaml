# Helm values for Immich (immich-app/immich-charts — bjw-s common-library based).
#
# ⚠️ STRUCTURE MATTERS for this chart:
#   env  → controllers.main.containers.main.env   (NOT a top-level env:)
#   svc  → service.main
#   lib  → immich.persistence.library
# Redis auto-wires to <release>-valkey when valkey.enabled: true.

# Pin the Immich version — photos are precious, so upgrades should be DELIBERATE
# (a surprise bump can run DB migrations that are hard to roll back). Bump this tag
# on purpose, snapshot/back up first, then redeploy.
image:
  tag: v3.0.0

# Pin ALL Immich pods to the labeled 32GB worker (heavy: ML + storage).
defaultPodOptions:
  nodeSelector:
    immich-node: "true"

# Photo library → the pre-created NFS-backed PVC (immich-prereqs.yaml).
immich:
  persistence:
    library:
      existingClaim: immich-library

# Let the chart deploy + auto-wire Valkey (Redis). REDIS_HOSTNAME → immich-valkey.
valkey:
  enabled: true

# Environment — connect to the EXTERNAL vector Postgres (immich-prereqs.yaml).
# MUST live here (controllers.main.containers.main.env) for this chart to apply it.
controllers:
  main:
    containers:
      main:
        env:
          DB_HOSTNAME: immich-postgres
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: password

# Services stay ClusterIP (default) — a single NodePort leaks onto the machine-learning
# service too and conflicts. Reach Immich via port-forward for now, or an Ingress:
#   sudo k3s kubectl -n media port-forward svc/immich-server 2283:2283  → http://localhost:2283
# (We'll add immich.williampring.ca to the TLS Ingress once it's running.)
