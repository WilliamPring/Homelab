---
# vars/secrets.example.yaml — TEMPLATE (safe to commit — no real secrets here).
#
# Copy it to vars/secrets.local.yaml (which git IGNORES via the *.local.yaml rule)
# and put your REAL values there:
#
#   cp vars/secrets.example.yaml vars/secrets.local.yaml
#   # then edit vars/secrets.local.yaml
#
# The Vaultwarden play reads vars/secrets.local.yaml and creates the k8s Secret
# from it — so the password lives on your run machine + the cluster, never in git.

# The Postgres password for Vaultwarden (from scripts/postgres-setup.sh output).
vaultwarden_db_password: "PUT-THE-POSTGRES-PASSWORD-HERE"
