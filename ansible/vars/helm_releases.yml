---
# vars/helm_releases.yml — Helm charts Ansible deploys. EMPTY on purpose.
#
# Every app is on GitOps (Argo CD) — see gitops/apps/*.yaml, one Application per app:
#   vaultwarden · immich · immich-prereqs · immich-public-proxy · kavita · komf · calibre
#   searxng · degoog · homepage · ntfy · romm
#
# Ansible's remaining job is INFRA only (ansible/site.yml):
#   Tailscale, k3s server/agent, cert-manager + the Let's Encrypt ClusterIssuer,
#   the out-of-git bits apps depend on (immich-db Secret, immich-node label, sops-age key).
#
# Play 6 in site.yml still loops over this list, so it must exist (as []). Add a dict only
# if an INFRA chart genuinely has to be installed before Argo exists. Fields:
#   name, repo_name, repo, chart, namespace, values_file, [version], [enabled]
#
# Planned: cert-manager moves from the Ansible role to an Argo app too (so Renovate tracks
# it — it is currently several minor versions behind). After that this file can go.
helm_releases: []
