---
# vars/helm_releases.yml — the list of Helm apps Ansible deploys.
#
# EMPTY — all apps have been migrated to GitOps (Argo CD). See gitops/.
#   • Vaultwarden → gitops/apps/vaultwarden.yaml + gitops/vaultwarden/values.yaml
#   • Immich      → gitops/apps/immich.yaml + gitops/immich/
#
# Ansible now handles INFRA only (Tailscale, k3s, cert-manager/ClusterIssuer, the
# out-of-git Secrets + node labels). App deployment lives in Argo.
#
# If you ever need Ansible to deploy a Helm chart again (e.g. an infra chart), add a dict
# here — the loop in site.yml Play 6 + roles/helm_release still work. Fields:
#   name, repo_name, repo, chart, namespace, values_file, [version], [enabled].
helm_releases: []
