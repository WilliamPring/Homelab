---
# vars/helm_releases.yml — the list of Helm apps to deploy (loaded by the Vaultwarden play).
#
# To ADD a Helm app:  add a dict below + create helm-values/<name>.yaml
# To DISABLE one:     set enabled: false
#
# Fields: name (release), repo_name, repo (url), chart, namespace, values_file,
#         [version] (optional chart pin), [enabled] (default true).
helm_releases:
  - name: vaultwarden
    repo_name: vaultwarden
    repo: https://guerzon.github.io/vaultwarden
    chart: vaultwarden
    namespace: apps
    values_file: helm-values/vaultwarden.yaml
    enabled: true
