---
# vars/routes.yml — the list of HTTPRoutes (Gateway API). Loaded by the "Routes" play.
#
# To route an app: add a dict here (name, namespace, hostname, service, port). The play
# generates one HTTPRoute per entry, attached to the 'main' Gateway. No playbook edits.
#
# Start with Jellyfin to prove the chain, then add the rest.
routes:
  - name: jellyfin
    namespace: media
    hostname: jellyfin.media.williampring.ca
    service: jellyfin        # the Service name (chart creates 'jellyfin')
    port: 8096

  - name: vaultwarden
    namespace: apps
    hostname: vault.apps.williampring.ca
    service: vaultwarden       # verify: kubectl get svc -n apps (chart names it 'vaultwarden')
    port: 80

  # Add more later, e.g.:
  # - name: pihole
  #   namespace: network
  #   hostname: pihole.net.williampring.ca
  #   service: pihole-web
  #   port: 80
