# ansible.cfg — project-local Ansible configuration.
#
# Ansible looks for a config file in this order and uses the FIRST one it finds:
#   1. ANSIBLE_CONFIG (env var)
#   2. ./ansible.cfg          <-- this file (only used when you run from this dir)
#   3. ~/.ansible.cfg
#   4. /etc/ansible/ansible.cfg
#
# Because this lives next to your playbooks, running `ansible-playbook` from the
# `ansible/` directory automatically picks up these settings. No flags needed.

[defaults]
# Where the list of machines lives. Relative to this file.
inventory = inventory.ini

# Don't prompt "are you sure?" the first time we SSH to a new host and its key
# is unknown. Fine for a homelab you control; you'd want this ON for production.
host_key_checking = False

# Let Ansible auto-detect the Python interpreter on the remote node and stop
# warning about it. (Ansible runs Python modules on the target; it finds python3.)
interpreter_python = auto_silent

# Prettier, more readable task output than the default JSON-ish blobs.
stdout_callback = yaml

# Keep a human-friendly log of every run for later debugging.
log_path = ./ansible.log

[privilege_escalation]
# We use `become: true` in the playbook to run tasks as root via sudo.
# If your VM's SSH user needs a sudo password, run playbooks with `--ask-become-pass`.
become = false
become_method = sudo
