---
# site.yml — the homelab playbook. Minimal + clean.
#
#   ansible-playbook site.yml --ask-become-pass
#
# A playbook is an ordered list of "plays". Each play targets a group of hosts
# and applies roles/tasks to them, top to bottom.

# ─── PLAY 1: Tailscale on every node ─────────────────────────────────────────
# Runs first so remote access exists before k3s. become: true = run as root.
- name: Install and connect Tailscale on all nodes
  hosts: k3s_cluster
  become: true
  roles:
    - tailscale

# ─── PLAY 2: k3s control plane (master) ──────────────────────────────────────
- name: Install k3s control plane (server)
  hosts: master
  become: true
  roles:
    - k3s_server

# ─── PLAY 3: k3s workers (agents) ────────────────────────────────────────────
# Skipped automatically when [workers] is empty (single-node cluster).
- name: Join k3s workers (agents) to the cluster
  hosts: workers
  become: true
  roles:
    - k3s_agent

# ─── PLAY 4: Search apps (SearXNG + degoog — comparing the two) ───────────────
# Hand-written manifest apps → apps namespace.
#   SearXNG → 30880 (metasearch — aggregates many engines; stateless)
#   degoog  → 30882 (search aggregator + plugin system; has a PVC + settings password)
- name: Deploy search apps
  hosts: master
  become: true
  roles:
    - searxng
    - degoog

# ─── PLAY 5: Vaultwarden (Helm) ──────────────────────────────────────────────
# Data-driven Helm: the app list lives in vars/helm_releases.yml (just Vaultwarden).
# Access while learning:  sudo k3s kubectl -n apps port-forward svc/vaultwarden 8080:80
- name: Deploy Vaultwarden (Helm release)
  hosts: master
  become: true
  vars_files:
    - vars/helm_releases.yml
  tasks:
    - name: Deploy Helm release
      ansible.builtin.include_role:
        name: helm_release
      vars:
        helm_name: "{{ item.name }}"
        helm_repo_name: "{{ item.repo_name }}"
        helm_repo: "{{ item.repo }}"
        helm_chart: "{{ item.chart }}"
        helm_namespace: "{{ item.namespace }}"
        helm_values_file: "{{ item.values_file }}"
        helm_chart_version: "{{ item.version | default(omit) }}"
      loop: "{{ helm_releases | default([]) }}"
      when: item.enabled | default(true)
      loop_control:
        label: "{{ item.name }}"

# ─── PLAY 6: TLS — real HTTPS via Let's Encrypt (Cloudflare DNS-01) ───────────
# Installs cert-manager + a Let's Encrypt ClusterIssuer (Cloudflare DNS-01) + an
# Ingress for Vaultwarden (vault.williampring.ca). Gated by tls_enabled.
# ⚠️ ONE-TIME prereq (by hand): create the Cloudflare token secret —
#   sudo k3s kubectl create secret generic cloudflare-api-token \
#     -n cert-manager --from-literal=api-token=<YOUR_CF_TOKEN>
- name: TLS (Let's Encrypt via Cloudflare DNS-01)
  hosts: master
  become: true
  roles:
    - role: certmanager
      when: tls_enabled | default(false)
    - role: tls_ingress
      when: tls_enabled | default(false)
