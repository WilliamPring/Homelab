---
# site.yml — the homelab playbook. Minimal + clean.
#
#   ansible-playbook site.yml --ask-become-pass
#
# A playbook is an ordered list of "plays". Each play targets a group of hosts
# and applies roles/tasks to them, top to bottom.

# ─── PLAY 1: Tailscale on every node ─────────────────────────────────────────
# Runs first so remote access exists before k3s. become: true = run as root.
- name: Install and connect Tailscale on all nodes
  hosts: k3s_cluster
  become: true
  roles:
    - tailscale

# ─── PLAY 2: k3s control plane (master) ──────────────────────────────────────
- name: Install k3s control plane (server)
  hosts: master
  become: true
  roles:
    - k3s_server

# ─── PLAY 3: k3s workers (agents) ────────────────────────────────────────────
# Skipped automatically when [workers] is empty (single-node cluster).
- name: Join k3s workers (agents) to the cluster
  hosts: workers
  become: true
  roles:
    - k3s_agent

# ─── PLAY 5: Immich INFRA (immich-db secret + worker node label) ─────────────
# Immich's MANIFESTS + chart are now on GitOps (Argo CD). This play only ensures the
# out-of-git bits the GitOps manifests reference: the immich-db Secret + the immich-node
# label on the 32GB worker. Gated by immich_enabled. See gitops/apps/immich*.yaml.
- name: Immich infra (secret + node label)
  hosts: master
  become: true
  roles:
    - role: immich
      when: immich_enabled | default(false)

# ─── PLAY 6: App secrets (infra) ─────────────────────────────────────────────
# All apps are on GitOps now, so vars/helm_releases.yml is EMPTY and the Helm loop below
# is dormant (kept for any future infra Helm chart). What this play still does: create the
# vaultwarden-db Secret (the out-of-git Postgres URI Vaultwarden's GitOps app references).
- name: App secrets + (dormant) Helm releases
  hosts: master
  become: true
  vars_files:
    - vars/helm_releases.yml
  tasks:
    # Create the vaultwarden-db k8s Secret from a GITIGNORED local file
    # (vars/secrets.local.yaml) so the DB password stays out of git.
    # First: cp vars/secrets.example.yaml vars/secrets.local.yaml  + fill in the password.
    - name: Load local secrets (vars/secrets.local.yaml — gitignored) if present
      ansible.builtin.include_vars: vars/secrets.local.yaml
      failed_when: false

    - name: Ensure the apps namespace exists
      ansible.builtin.shell: >
        k3s kubectl create namespace apps --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: false

    - name: Create the Vaultwarden DB Secret (FULL connection URI, from vars/secrets.local.yaml)
      ansible.builtin.shell: >
        k3s kubectl create secret generic vaultwarden-db -n apps
        --from-literal=uri='postgresql://vaultwarden:{{ vaultwarden_db_password }}@192.168.68.7:5432/vaultwarden'
        --dry-run=client -o yaml | k3s kubectl apply -f -
      no_log: true
      when: vaultwarden_db_password is defined
      changed_when: false

# ─── PLAY 7: TLS — real HTTPS via Let's Encrypt (Cloudflare DNS-01) ───────────
# Installs cert-manager + a Let's Encrypt ClusterIssuer (Cloudflare DNS-01) + an
# Ingress for Vaultwarden (vault.williampring.ca). Gated by tls_enabled.
# ⚠️ ONE-TIME prereq (by hand): create the Cloudflare token secret —
#   sudo k3s kubectl create secret generic cloudflare-api-token \
#     -n cert-manager --from-literal=api-token=<YOUR_CF_TOKEN>
- name: TLS (Let's Encrypt via Cloudflare DNS-01)
  hosts: master
  become: true
  roles:
    - role: certmanager
      when: tls_enabled | default(false)
    - role: tls_ingress
      when: tls_enabled | default(false)
