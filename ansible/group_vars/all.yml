---
# group_vars/all.yml — variables applied to ALL hosts in the inventory.
# Ansible auto-loads group_vars/<groupname>.yml; the special group "all" matches
# every host. Change behaviour here instead of editing the roles.

# ─── k3s ───────────────────────────────────────────────────────────────────────
k3s_channel: "stable"      # k3s release channel; pin an exact version for reproducibility
k3s_server_args: ""        # extra flags for the k3s SERVER install (control plane)
k3s_agent_args: ""         # extra flags for the k3s AGENT install (workers)

# ─── Tailscale ──────────────────────────────────────────────────────────────────
# Flags for `tailscale up`. Disable Tailscale's DNS takeover so it doesn't fight
# your LAN/k3s DNS.
tailscale_up_args: "--accept-dns=false"

# ─── Immich (photos) — HEAVY, pinned to the 32GB worker ─────────────────────────
# Controls Play 5 (the out-of-git immich-db Secret + the immich-node label on the 32GB
# worker). Immich itself is deployed by Argo CD (gitops/apps/immich*.yaml). Requires:
# the 32GB worker joined, and immich_db_password set in vars/secrets.local.yaml.
immich_enabled: true

# ─── TLS — the one Ingress Ansible still owns (Immich) ───────────────────────────
# cert-manager + the Let's Encrypt ClusterIssuer are on Argo CD (docs/tls.md). Set true to
# enable Play 5, which only applies the Immich Ingress object (it moves to gitops later).
tls_enabled: true
