---
# roles/ingress/tasks/main.yml — deploy ONE Traefik Ingress (called in a loop from
# the "TLS ingress" play, once per entry in vars/routes.yml). Runs on the master.
# Expects vars: route_name, route_namespace, route_hostname, route_service, route_port.

- name: "Render the Ingress for {{ route_name }}"
  ansible.builtin.template:
    src: ingress.yaml.j2
    dest: "/etc/ingress-{{ route_name }}.yaml"

- name: "Apply the Ingress for {{ route_name }}"
  ansible.builtin.command: "k3s kubectl apply -f /etc/ingress-{{ route_name }}.yaml"
  register: ingress_apply
  changed_when: "'created' in ingress_apply.stdout or 'configured' in ingress_apply.stdout"

- name: "Ingress summary — {{ route_name }}"
  ansible.builtin.debug:
    msg: "✅ https://{{ route_hostname }} → {{ route_service }}:{{ route_port }} (ns {{ route_namespace }})"
