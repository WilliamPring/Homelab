# qBittorrent + Gluetun (Mullvad VPN sidecar) in the `vpn` namespace.
# ALL qBittorrent traffic exits through Mullvad WireGuard via the Gluetun sidecar —
# nothing leaks to your real IP. Adapted from k3s/namespace/vpn/vpn-stack.yaml.
#
# REQUIRES before enabling:
#   1. Secret 'mullvad-creds' in namespace vpn (private-key + address) — see role summary.
#   2. /dev/net/tun on the node (Gluetun needs it).
#   3. The downloads path on the node (hostPath below).
---
apiVersion: v1
kind: Namespace
metadata:
  name: vpn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: vpn
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate            # hostPath + one VPN tunnel → one pod at a time
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # TODO: pin to the node with the downloads storage (the HP/DAS) once it exists:
      #   nodeSelector: { kubernetes.io/hostname: <hp-hostname> }
      containers:
        - name: gluetun          # the VPN sidecar — creates the Mullvad tunnel
          image: qmcgaw/gluetun:latest
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: mullvad
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mullvad-creds
                  key: private-key
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: mullvad-creds
                  key: address
            - name: SERVER_COUNTRIES
              value: Canada
            - name: SERVER_CITIES
              value: Toronto
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.42.0.0/16   # allow cluster pod-to-pod traffic to bypass the VPN
            - name: FIREWALL_INPUT_PORTS
              value: "8080"         # open the WebUI port through Gluetun's firewall
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
        - name: qbittorrent        # shares gluetun's network → all traffic via the tunnel
          image: lscr.io/linuxserver/qbittorrent:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
        - name: config
          hostPath:
            path: /opt/qbittorrent/config
        - name: downloads
          hostPath:
            path: /mnt/storage/downloads    # the DAS/mergerfs pool (was /mnt/data/downloads)
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: vpn
  labels:
    app: qbittorrent
spec:
  type: NodePort
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080            # web UI at http://<node-ip>:30080
