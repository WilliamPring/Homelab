# Vaultwarden (password manager) in the `apps` function namespace.
# Path A: learn-now / THROWAWAY data — do NOT store real passwords until backups
# (Phase 7) and the HP exist.
#
# ⚠️  The WEB VAULT needs a "secure context" (HTTPS or localhost) because it uses the
# browser Web Crypto API. Over plain-http NodePort it will LOAD but you can't log in.
# To test it now without TLS, port-forward to localhost (localhost counts as secure):
#     sudo k3s kubectl -n apps port-forward svc/vaultwarden 8080:80
#     → open http://localhost:8080
# Real/remote use needs the TLS ingress foundation (a later step).
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: apps
  labels:
    app: vaultwarden
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # storageClassName omitted → uses k3s default (local-path) on the node's disk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: apps
  labels:
    app: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  strategy:
    type: Recreate            # RWO volume → one pod at a time
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:latest
          env:
            - name: SIGNUPS_ALLOWED
              value: "true"    # lets you create your account; set "false" afterwards
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data     # Vaultwarden keeps its SQLite DB + attachments here
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: apps
  labels:
    app: vaultwarden
spec:
  type: NodePort
  selector:
    app: vaultwarden
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082          # http://<node-ip>:30082  (but see the secure-context note)
