---
# roles/vaultwarden/tasks/main.yml — deploy Vaultwarden into k3s (apps namespace).
# Runs on the master. Same copy-then-apply pattern as the pihole role.

- name: Copy the Vaultwarden manifest to the master
  ansible.builtin.copy:
    src: vaultwarden.yaml
    dest: /etc/vaultwarden.yaml

- name: Apply the Vaultwarden manifest
  ansible.builtin.command: k3s kubectl apply -f /etc/vaultwarden.yaml
  register: vaultwarden_apply
  changed_when: "'created' in vaultwarden_apply.stdout or 'configured' in vaultwarden_apply.stdout"

- name: Vaultwarden — what kubectl changed
  ansible.builtin.debug:
    msg: "{{ vaultwarden_apply.stdout_lines }}"

- name: Vaultwarden — summary (how to use it / what to know)
  ansible.builtin.debug:
    msg:
      - "✅ Vaultwarden deployed → namespace 'apps' (NodePort 30082)"
      - "⚠  The web vault needs HTTPS or localhost — plain http://<ip>:30082 will load but WON'T let you log in."
      - "🔗 To use it now, port-forward to localhost (counts as secure):"
      - "     sudo k3s kubectl -n apps port-forward svc/vaultwarden 8080:80"
      - "     then open  http://localhost:8080"
      - "⚠  THROWAWAY data — do NOT store real passwords until backups + the HP exist."
      - "🔍 Verify:  sudo k3s kubectl get pods -n apps -o wide"
