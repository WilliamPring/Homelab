# Self-signed internal CA for the homelab — NO Cloudflare, NO Let's Encrypt/ACME.
# cert-manager issues TLS certs entirely offline, signed by a CA you own. Install the
# CA cert on your devices to make these certs trusted (otherwise browsers warn).
---
# 1) Bootstrap issuer that can sign self-signed certs
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# 2) A root CA certificate, self-signed by the issuer above, stored as a Secret
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: homelab-ca
  secretName: homelab-ca-secret
  duration: 87600h            # 10 years — it's your own root CA
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
# 3) The issuer your services actually use — signs their certs from the homelab CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-issuer
spec:
  ca:
    secretName: homelab-ca-secret
