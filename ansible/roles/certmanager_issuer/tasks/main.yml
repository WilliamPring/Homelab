---
# roles/certmanager_issuer/tasks/main.yml
#
# Creates a SELF-SIGNED internal CA + ClusterIssuers in cert-manager. NO Cloudflare,
# NO ACME/Let's Encrypt — fully offline TLS. Runs on the master, AFTER cert-manager is
# installed (Play 6 deploys cert-manager via helm_app first).

- name: Wait for cert-manager to be up (deployments Available)
  # cert-manager is installed async by k3s's Helm controller, so its Deployments +
  # webhook may not exist the instant this runs. Retry the wait until they're ready —
  # the webhook must be up before it will accept our Issuer/Certificate resources.
  ansible.builtin.command: >
    k3s kubectl wait --for=condition=Available --timeout=30s deploy --all -n cert-manager
  register: cm_wait
  until: cm_wait.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  failed_when: false

- name: Copy the self-signed CA issuer manifest to the master
  ansible.builtin.copy:
    src: issuer.yaml
    dest: /etc/certmanager-issuer.yaml

- name: Apply the self-signed CA + ClusterIssuers
  # Retry: even after deployments are Available, the validating webhook can take a few
  # seconds to be reachable — the apply then succeeds on a retry.
  ansible.builtin.command: k3s kubectl apply -f /etc/certmanager-issuer.yaml
  register: issuer_apply
  until: issuer_apply.rc == 0
  retries: 10
  delay: 6
  changed_when: "'created' in issuer_apply.stdout or 'configured' in issuer_apply.stdout"

- name: cert-manager issuer — summary (self-signed CA, no Cloudflare)
  ansible.builtin.debug:
    msg:
      - "✅ Self-signed internal CA + ClusterIssuers created — NO Cloudflare, fully offline."
      - "   • selfsigned         → bootstraps the CA"
      - "   • homelab-ca-issuer  → the issuer your services reference to get TLS certs"
      - "🔍 Check issuers:  sudo k3s kubectl get clusterissuer"
      - "🔍 CA secret:      sudo k3s kubectl get secret homelab-ca-secret -n cert-manager"
      - "📝 To give an app TLS: create a Certificate in its namespace with issuerRef"
      - "   name: homelab-ca-issuer, kind: ClusterIssuer."
      - "ℹ️  Certs are self-signed → browsers warn until you install the CA cert on devices."
      - "   Swap to Let's Encrypt later if you want publicly-trusted certs."