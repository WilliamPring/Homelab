# SearXNG — privacy-respecting metasearch engine. Light app → hand-written manifest
# (no solid official Helm chart; simpler + more reliable this way). Namespace: apps.
#
# Minimal single-container setup (limiter off, no Valkey) — perfect for a personal
# instance. Add a Valkey Deployment + set server.limiter: true later if you want
# rate-limiting/caching.
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: apps
  labels:
    app: searxng
data:
  settings.yml: |
    # Inherit SearXNG's defaults, override only what we need.
    use_default_settings: true
    general:
      instance_name: "Homelab Search"
    server:
      # ⚠️ CHANGE THIS to a random string:  openssl rand -hex 32
      secret_key: "REPLACE-WITH-RANDOM-KEY-openssl-rand-hex-32"
      limiter: false          # no Valkey → limiter off (fine for personal use)
      image_proxy: true       # proxy image results for privacy
      # base_url auto-detects from the request → works on NodePort AND later via TLS
    search:
      autocomplete: "duckduckgo"
      safe_search: 0
    ui:
      default_theme: simple
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: apps
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:latest   # pin a tag later for reproducibility
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: apps
  labels:
    app: searxng
spec:
  type: NodePort
  selector:
    app: searxng
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30880
