---
# roles/immich/tasks/main.yml — Immich INFRA ONLY (the bits GitOps deliberately keeps out
# of git): the immich-db Secret (DB password) + the worker node label.
#
# The actual Immich manifests (vector Postgres, library PV/PVC) + the Helm chart now live
# in GitOps / Argo CD:
#   gitops/immich/prereqs/   (Postgres + NFS library)   → app: immich-prereqs
#   gitops/immich/values.yaml + gitops/apps/immich.yaml (OCI Helm chart) → app: immich
# So this role no longer applies any manifests — it only ensures the secret + label exist
# (which the GitOps manifests reference but can't create themselves).

- name: Load local secrets (vars/secrets.local.yaml — gitignored) if present
  ansible.builtin.include_vars: vars/secrets.local.yaml
  failed_when: false

- name: Ensure the media namespace exists
  ansible.builtin.shell: >
    k3s kubectl create namespace media --dry-run=client -o yaml | k3s kubectl apply -f -
  changed_when: false

- name: Create the immich-db Secret (from vars/secrets.local.yaml)
  ansible.builtin.shell: >
    k3s kubectl create secret generic immich-db -n media
    --from-literal=password='{{ immich_db_password }}'
    --dry-run=client -o yaml | k3s kubectl apply -f -
  no_log: true
  when: immich_db_password is defined
  changed_when: false

- name: Label the worker node so Immich pins to it (heavy — ML + storage)
  ansible.builtin.command: "k3s kubectl label node k3s-worker-01 immich-node=true --overwrite"
  when: groups['workers'] | default([]) | length > 0
  changed_when: false

- name: Immich infra — summary
  ansible.builtin.debug:
    msg:
      - "✅ Immich INFRA ready: immich-db Secret + worker node label (immich-node=true)."
      - "   The Immich MANIFESTS + chart are deployed by Argo CD, not Ansible:"
      - "     gitops/apps/immich-prereqs.yaml  → Postgres + NFS library (sync FIRST)"
      - "     gitops/apps/immich.yaml          → the OCI Helm chart"
      - "🔍 sudo k3s kubectl get secret immich-db -n media"
      - "🔍 sudo k3s kubectl get node k3s-worker-01 --show-labels | grep immich-node"
