# Immich PREREQUISITES — the things the Immich Helm chart needs but does NOT create:
#   1. a Postgres with Immich's REQUIRED vector extension (not vanilla Postgres)
#   2. the photo LIBRARY PVC (the chart says: "auto-creating the library volume is not supported")
#   3. a DB password Secret (shared by Postgres + the Immich chart)
# Applied BEFORE the Immich Helm release (Play 4 runs before Play 5).
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: Secret
metadata:
  name: immich-db
  namespace: media
type: Opaque
stringData:
  password: "changeme"        # ⚠️ change + move to ansible-vault before real use
---
# Postgres with the pgvecto.rs / VectorChord extension — Immich REQUIRES this exact image.
# Keep the tag in sync with Immich's docker-compose (it changes with Immich releases).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: media
  labels:
    app: immich-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: shm            # Immich's compose sets shm_size 128mb; mirror it here
              mountPath: /dev/shm
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: immich-postgres-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data
  namespace: media
  labels:
    app: immich-postgres
spec:
  accessModes: [ReadWriteOnce]      # local-path = RWO
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: media
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# The photo LIBRARY volume — Immich stores all originals here. Big; put it on the DAS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: media
  labels:
    app: immich
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Gi              # adjust to your real photo needs / DAS size
