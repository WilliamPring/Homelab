# The one Ingress still managed by Ansible (Immich). Its APP is on Argo; only this Ingress
# object remains here until it moves into gitops/immich. The 'letsencrypt' ClusterIssuer it
# references is on Argo CD:
#   gitops/cert-manager/issuer/letsencrypt.yaml   (app: cert-manager-issuer)
# and the cloudflare-api-token Secret it needs is hand-created (docs/secrets.md).
---
# NOTE: SearXNG + degoog Ingresses moved to GitOps (gitops/searxng/, gitops/degoog/) —
# Argo owns those apps end-to-end (workload + domain). The 'letsencrypt' ClusterIssuer
# above stays here (shared infra). See gitops/README.md.
#
# ⚠️ The Immich Ingress (below) still lives HERE. Its APP is on Argo, but its domain is still
# Ansible-managed. SAFE (Argo doesn't define this Ingress) — fold it into gitops/immich later.
---
# Ingress for Immich (photos). https://immich.williampring.ca — note: media namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - immich.williampring.ca
      secretName: immich-tls
  rules:
    - host: immich.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
