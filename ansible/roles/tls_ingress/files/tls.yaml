# Let's Encrypt ClusterIssuer (Cloudflare DNS-01) — shared INFRA — plus the remaining
# app Ingresses still managed by Ansible (Vaultwarden, Immich). SearXNG + degoog Ingresses
# moved to GitOps; see the note further down.
#
# ⚠️ PREREQUISITE — create the Cloudflare token secret ONCE, by hand (keeps it out
#    of git). Use your "Edit zone DNS" token:
#      sudo k3s kubectl create secret generic cloudflare-api-token \
#        -n cert-manager --from-literal=api-token=<YOUR_CF_TOKEN>
#
# DNS-01 validates via a Cloudflare TXT record — so the cert issues even though
# Vaultwarden is only reachable over Tailscale (no public exposure needed).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: william.pring@telus.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
# Ingress for Vaultwarden. The cert-manager annotation makes ingress-shim
# auto-create the cert (into vault-tls) from the ClusterIssuer above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vault.williampring.ca
      secretName: vault-tls
  rules:
    - host: vault.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden       # guerzon chart names the service 'vaultwarden'
                port:
                  number: 80
---
# NOTE: SearXNG + degoog Ingresses moved to GitOps (gitops/searxng/, gitops/degoog/) —
# Argo owns those apps end-to-end (workload + domain). The 'letsencrypt' ClusterIssuer
# above stays here (shared infra). See gitops/README.md.
#
# ⚠️ Vaultwarden + Immich Ingresses (below) still live HERE. Their APPS are on Argo, but
# their domains are still Ansible-managed. This is SAFE (Argo doesn't define these
# Ingresses, so there's no conflict) — but it's the last bit of app/infra split. To fully
# fold them in later: move each Ingress into its GitOps app + delete it here.
---
# Ingress for Immich (photos). https://immich.williampring.ca — note: media namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - immich.williampring.ca
      secretName: immich-tls
  rules:
    - host: immich.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
