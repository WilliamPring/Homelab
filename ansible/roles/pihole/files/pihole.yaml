# Pi-hole in k3s, in the `network` function namespace (grouped-by-function convention).
# Edit the password/timezone below if you like, then re-run.
#
# ⚠️  Moving namespaces: if Pi-hole was previously deployed in the old `pihole`
# namespace, delete it FIRST so it releases hostPort 53:
#     sudo k3s kubectl delete namespace pihole
# (config lives on the node at /opt/pihole, so it survives the namespace change.)
---
apiVersion: v1
kind: Namespace
metadata:
  name: network
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: network
  labels:
    app: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate            # hostPort 53 can only be held by one pod at a time
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
        - name: pihole
          image: pihole/pihole:latest
          env:
            - name: TZ
              value: "America/Toronto"
            - name: FTLCONF_webserver_api_password
              value: "changeme"          # admin password — change this
            - name: FTLCONF_dns_listeningMode
              value: "all"               # answer DNS from other machines on the LAN
          ports:
            - containerPort: 53
              hostPort: 53
              protocol: TCP
            - containerPort: 53
              hostPort: 53
              protocol: UDP
            - containerPort: 80
          volumeMounts:
            - name: etc-pihole
              mountPath: /etc/pihole
      volumes:
        - name: etc-pihole
          hostPath:
            path: /opt/pihole/etc-pihole
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: network
  labels:
    app: pihole
spec:
  type: NodePort
  selector:
    app: pihole
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081          # web UI at  http://<node-ip>:30081/admin
