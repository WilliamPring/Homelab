# Pi-hole in k3s. Edit the password/timezone below if you like, then re-run.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pihole
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate            # hostPort 53 can only be held by one pod at a time
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
        - name: pihole
          image: pihole/pihole:latest
          env:
            - name: TZ
              value: "America/Toronto"
            - name: FTLCONF_webserver_api_password
              value: "changeme"          # admin password — change this
            - name: FTLCONF_dns_listeningMode
              value: "all"               # answer DNS from other machines on the LAN
          ports:
            - containerPort: 53
              hostPort: 53
              protocol: TCP
            - containerPort: 53
              hostPort: 53
              protocol: UDP
            - containerPort: 80
          volumeMounts:
            - name: etc-pihole
              mountPath: /etc/pihole
      volumes:
        - name: etc-pihole
          hostPath:
            path: /opt/pihole/etc-pihole
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
spec:
  type: NodePort
  selector:
    app: pihole
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081          # web UI at  http://<node-ip>:30081/admin
