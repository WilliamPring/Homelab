---
# roles/jellyfin/tasks/main.yml — deploy Jellyfin into k3s (media namespace).
# Runs on the master. Same copy-then-apply pattern as the pihole role.

- name: Copy the Jellyfin manifest to the master
  ansible.builtin.copy:
    src: jellyfin.yaml
    dest: /etc/jellyfin.yaml

- name: Apply the Jellyfin manifest
  ansible.builtin.command: k3s kubectl apply -f /etc/jellyfin.yaml
  register: jellyfin_apply
  changed_when: "'created' in jellyfin_apply.stdout or 'configured' in jellyfin_apply.stdout"

- name: Jellyfin — what kubectl changed
  ansible.builtin.debug:
    msg: "{{ jellyfin_apply.stdout_lines }}"

- name: Jellyfin — summary (how to use it / what to know)
  ansible.builtin.debug:
    msg:
      - "✅ Jellyfin deployed → namespace 'media' (NodePort 30096)"
      - "🔗 Web UI:  http://{{ ansible_host }}:30096"
      - "⚠  Empty shell until the HP joins — no media library and no hardware transcoding yet."
      - "⚠  Heavy app: on a small node (2GB Rock / tiny disk) it can Evict under DiskPressure."
      - "     If it does, park it:  sudo k3s kubectl delete all -l app=jellyfin -n media"
      - "🔍 Verify:  sudo k3s kubectl get pods -n media -o wide"
