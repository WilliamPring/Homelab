# Jellyfin (media server) in the `media` function namespace.
# Path A: this is an EMPTY SHELL until the HP exists — no media library and no
# hardware transcoding yet. It's here to learn the manifest mechanics.
#
# TODO (once the HP joins the cluster):
#   - pin to it:   nodeSelector: { kubernetes.io/hostname: <hp-hostname> }
#   - add QuickSync HW transcode: mount /dev/dri as a device into the container
#   - point the `media` volume at the real library path on the HP's SSD
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
  labels:
    app: jellyfin
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # TODO: nodeSelector to pin to the HP once it joins (see header).
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          env:
            - name: TZ
              value: "America/Toronto"
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          hostPath:
            path: /mnt/media          # empty for now; real library lives on the HP later
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  type: NodePort
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      nodePort: 30096          # web UI at  http://<node-ip>:30096
