---
# roles/helm_app/tasks/main.yml
#
# GENERIC role to deploy any Helm chart via k3s's built-in Helm controller
# (the HelmChart CRD). No `helm` binary needed — you apply a HelmChart resource
# and k3s installs the chart for you. Runs on the master.
#
# Use it per-app by passing vars in the play, e.g.:
#   - role: helm_app
#     vars:
#       helm_app_name: cert-manager
#       helm_app_chart: cert-manager
#       helm_app_repo: https://charts.jetstack.io
#       helm_app_version: v1.17.2
#       helm_app_namespace: cert-manager
#       helm_app_values: |
#         crds:
#           enabled: true

- name: Validate required helm_app vars
  ansible.builtin.assert:
    that:
      - helm_app_name is defined
      - helm_app_chart is defined
      - helm_app_repo is defined
    fail_msg: "helm_app needs at least: helm_app_name, helm_app_chart, helm_app_repo"

- name: Ensure the HelmChart manifest directory exists
  ansible.builtin.file:
    path: /etc/k3s-helm
    state: directory
    mode: "0700"

- name: "Render the HelmChart CRD for {{ helm_app_name }}"
  ansible.builtin.template:
    src: helmchart.yaml.j2
    dest: "/etc/k3s-helm/{{ helm_app_name }}.yaml"
    mode: "0644"

- name: "Apply the HelmChart CRD ({{ helm_app_name }})"
  # k3s's Helm controller sees this and installs/updates the chart asynchronously.
  ansible.builtin.command: "k3s kubectl apply -f /etc/k3s-helm/{{ helm_app_name }}.yaml"
  register: helm_apply
  changed_when: "'created' in helm_apply.stdout or 'configured' in helm_apply.stdout"

- name: "{{ helm_app_name }} — summary (Helm chart deploy)"
  ansible.builtin.debug:
    msg:
      - "✅ HelmChart '{{ helm_app_name }}' applied  (chart: {{ helm_app_chart }} @ {{ helm_app_repo }})"
      - "⏳ k3s's Helm controller is installing it into namespace '{{ helm_app_namespace }}' (async — give it a minute)."
      - "🔍 Watch pods:    sudo k3s kubectl get pods -n {{ helm_app_namespace }} -w"
      - "🔍 Chart status:  sudo k3s kubectl get helmchart -n kube-system {{ helm_app_name }}"
      - "🔧 Change values: edit the vars in site.yml and re-run — the chart upgrades in place."