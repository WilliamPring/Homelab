---
# roles/degoog/tasks/main.yml — deploy degoog (search aggregator + plugins) into
# k3s (apps ns). Runs on the master. Same copy-then-apply pattern as SearXNG.

- name: Copy the degoog manifest to the master
  ansible.builtin.copy:
    src: degoog.yaml
    dest: /etc/degoog.yaml

- name: Apply the degoog manifest
  ansible.builtin.command: k3s kubectl apply -f /etc/degoog.yaml
  register: degoog_apply
  changed_when: "'created' in degoog_apply.stdout or 'configured' in degoog_apply.stdout"

- name: degoog — summary
  ansible.builtin.debug:
    msg:
      - "✅ degoog (+ Valkey) deployed → namespace 'apps' (NodePort 30882)"
      - "🔗 http://{{ ansible_host }}:30882"
      - "🔒 Password unset (trusted LAN). SET DEGOOG_SETTINGS_PASSWORDS before exposing publicly — extensions run code!"
      - "🔍 sudo k3s kubectl get pods -n apps -l 'app in (degoog,degoog-valkey)'"
