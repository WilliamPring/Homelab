# degoog — self-hosted search aggregator with a plugin/extension system.
# https://github.com/degoog-org/degoog  ·  Namespace: apps.
#
# Heavier than SearXNG/Whoogle: it has STATE (SQLite + settings + extensions in
# /app/data → needs a PVC) and runs as user 1000:1000 (securityContext).
#
# ⚠️ SECURITY-CRITICAL: DEGOOG_SETTINGS_PASSWORDS must be set. The extension system
#    RUNS CODE on the server, so an unlocked instance = anyone can install an
#    extension = remote code execution. Placeholder below — change it, and move it
#    to a k8s Secret before real use.
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: degoog-data
  namespace: apps
  labels:
    app: degoog
spec:
  accessModes:
    - ReadWriteOnce          # local-path only does RWO (single node) — fine
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: degoog
  namespace: apps
  labels:
    app: degoog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: degoog
  template:
    metadata:
      labels:
        app: degoog
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000          # k8s chowns the PVC to 1000:1000 (degoog requires this)
      containers:
        - name: degoog
          image: ghcr.io/degoog-org/degoog:latest   # pin a tag later for reproducibility
          ports:
            - containerPort: 4444
          env:
            # ⚠️ CHANGE THIS + move to a Secret. Locks settings/extension install.
            - name: DEGOOG_SETTINGS_PASSWORDS
              value: "REPLACE-WITH-A-REAL-PASSWORD"
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: degoog-data
---
apiVersion: v1
kind: Service
metadata:
  name: degoog
  namespace: apps
  labels:
    app: degoog
spec:
  type: NodePort
  selector:
    app: degoog
  ports:
    - port: 4444
      targetPort: 4444
      nodePort: 30882
