# degoog + Valkey
#
# Degoog:
#   - Search aggregator / plugin system
#   - Persistent state in /app/data
#
# Valkey:
#   - Shared cache
#   - Service name MUST be degoog-valkey
#
# Storage:
#   - K3s local-path PVC
#   - fix-perms initContainer prepares /app/data for UID/GID 1000
#
# Security:
#   - Degoog has an extension system capable of executing code.
#   - Keep the settings password enabled, especially if exposed beyond LAN.

---
apiVersion: v1
kind: Secret
metadata:
  name: degoog-secret
  namespace: apps
type: Opaque
stringData:
  DEGOOG_SETTINGS_PASSWORDS: "asdfsas98df7as98df7as89f7as89df7@#$@#4"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: degoog-data
  namespace: apps
  labels:
    app: degoog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: degoog-valkey-data
  namespace: apps
  labels:
    app: degoog-valkey
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: degoog-valkey
  namespace: apps
  labels:
    app: degoog-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: degoog-valkey
  template:
    metadata:
      labels:
        app: degoog-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          command:
            - valkey-server
            - "--save"
            - ""
            - "--appendonly"
            - "no"

          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi

          volumeMounts:
            - name: valkey-data
              mountPath: /data

      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: degoog-valkey-data

---
apiVersion: v1
kind: Service
metadata:
  name: degoog-valkey
  namespace: apps
  labels:
    app: degoog-valkey
spec:
  type: ClusterIP
  selector:
    app: degoog-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: degoog
  namespace: apps
  labels:
    app: degoog
spec:
  replicas: 1

  selector:
    matchLabels:
      app: degoog

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: degoog

    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: fix-perms
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              chown -R 1000:1000 /app/data

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN

          volumeMounts:
            - name: data
              mountPath: /app/data

      containers:
        - name: degoog
          image: ghcr.io/degoog-org/degoog:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 4444
              protocol: TCP

          env:
            - name: DEGOOG_SETTINGS_PASSWORDS
              valueFrom:
                secretKeyRef:
                  name: degoog-secret
                  key: DEGOOG_SETTINGS_PASSWORDS

            - name: DEGOOG_PUBLIC_INSTANCE
              value: "false"

            - name: DEGOOG_VALKEY_URL
              value: "redis://degoog-valkey:6379"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /app/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: degoog-data

---
apiVersion: v1
kind: Service
metadata:
  name: degoog
  namespace: apps
  labels:
    app: degoog
spec:
  type: NodePort

  selector:
    app: degoog

  ports:
    - name: http
      port: 4444
      targetPort: 4444
      nodePort: 30882
      protocol: TCP