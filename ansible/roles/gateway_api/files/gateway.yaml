# Gateway API entry point for the homelab.
# Single *.williampring.ca wildcard, TLS from the self-signed homelab CA (cert-manager).
# Requires: Gateway API CRDs installed + cert-manager + homelab-ca-issuer (certmanager role).
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
# Enable Traefik's Gateway API provider (k3s Traefik, via HelmChartConfig).
# ⚠️ VERIFY-ON-DEPLOY: the exact values keys are Traefik-version-specific.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      enabled: true
      namespacePolicy: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
# Wildcard cert from the self-signed homelab CA → the wildcard-tls secret the Gateway uses.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: gateway
spec:
  secretName: wildcard-tls
  dnsNames:
    - "*.williampring.ca"
    - "williampring.ca"
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.williampring.ca"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-tls
      allowedRoutes:
        namespaces:
          from: All          # HTTPRoutes in any namespace may attach to this Gateway
