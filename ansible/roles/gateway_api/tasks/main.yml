---
# roles/gateway_api/tasks/main.yml — Gateway API foundation (CRDs + Traefik provider +
# GatewayClass + Gateway + wildcard cert). Runs on the master. Gated by gateway_api_enabled.
# REQUIRES cert-manager + homelab-ca-issuer (set certmanager_enabled: true).

- name: Check the running Traefik image (Gateway API needs Traefik v3)
  ansible.builtin.shell: >
    k3s kubectl get deploy traefik -n kube-system
    -o jsonpath='{.spec.template.spec.containers[0].image}'
  register: traefik_image
  changed_when: false
  failed_when: false

- name: Fail early if Traefik is v2 (its Gateway API support is too weak/experimental)
  ansible.builtin.fail:
    msg: |
      Gateway API needs Traefik v3, but the cluster is running:
        {{ traefik_image.stdout }}
      Recent k3s bundles Traefik v3 — upgrade k3s (or pin the Traefik chart to v3), then re-run.
  when: traefik_image.stdout is search('traefik:v?2\\.')

- name: Show the Traefik version in use
  ansible.builtin.debug:
    msg: "Traefik image: {{ traefik_image.stdout | default('(not found)') }}  — Gateway API requires v3."

- name: Install the Gateway API CRDs (not in k8s core)
  # Pinned version — keep compatible with the Traefik version k3s ships.
  ansible.builtin.command: >
    k3s kubectl apply -f
    https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
  register: gwapi_crds
  changed_when: "'created' in gwapi_crds.stdout or 'configured' in gwapi_crds.stdout"

- name: Copy the Gateway manifest to the master
  ansible.builtin.copy:
    src: gateway.yaml
    dest: /etc/gateway.yaml

- name: Apply the Gateway (Traefik provider config, GatewayClass, Certificate, Gateway)
  ansible.builtin.command: k3s kubectl apply -f /etc/gateway.yaml
  register: gw_apply
  changed_when: "'created' in gw_apply.stdout or 'configured' in gw_apply.stdout"

- name: Restart Traefik so it picks up the Gateway provider config
  # HelmChartConfig changes require Traefik to reload; the Helm controller usually handles
  # it, but a rollout restart makes it deterministic.
  ansible.builtin.command: k3s kubectl rollout restart deploy/traefik -n kube-system
  changed_when: false
  failed_when: false

- name: Gateway API — summary
  ansible.builtin.debug:
    msg:
      - "✅ Gateway API up: CRDs installed, Traefik Gateway provider enabled, Gateway 'main' created."
      - "🔗 TLS: *.home.arpa wildcard from the self-signed homelab CA (secret wildcard-tls)."
      - "📡 DNS: resolve *.home.arpa → the ingress node IP (Pi-hole record, or /etc/hosts on your box)."
      - "🔍 sudo k3s kubectl get gateway,gatewayclass -A"
      - "🔍 sudo k3s kubectl get httproute -A"
      - "⚠️ VERIFY-ON-DEPLOY: Traefik provider values keys are version-specific; cert-manager↔Gateway uses manual Certificate."