# pre-commit hooks — the cheap checks run on every commit; the slow full validation on push.
#   one-time:  pip install pre-commit  (or pipx) → pre-commit install --hook-type pre-commit --hook-type pre-push
#              (or `make hooks`)
# Renovate tracks the `rev:` pins below — but ONLY because renovate.json enables the `pre-commit`
# manager explicitly. It is disabled by default; without that block these pins never move.
#
# ⚠️ These hooks run on YOUR machine and only if you installed them. They are not a gate — CI is.
# Anything that must never reach main belongs in .github/workflows/validate.yaml as well.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(kubernetes|gitops)/.*/kustomization\.yaml$|^docs/archive/
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      # Catches PEM-headed keys (SSH/RSA/EC). ⚠️ It does NOT catch an age private key —
      # AGE-SECRET-KEY-1... has no PEM header. The local `age-private-key` hook below covers that.
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: local
    hooks:
      # KEPT after SOPS was retired (Nov 2026). It no longer decrypts anything here, but the old
      # age key still exists on the Arch box and this repo is public — a secret-detection hook is
      # not worth deleting for tidiness. detect-private-key cannot see it (no PEM header), so
      # block the literal prefix. A real key is AGE-SECRET-KEY-1 + 58 chars; the docs' truncated
      # "AGE-SECRET-KEY-1..." is left alone.
      - id: age-private-key
        name: "no age private key in a commit"
        entry: '(?i)AGE-SECRET-KEY-1[A-Z0-9]{10,}'
        language: pygrep
        types: [text]
      - id: conventions
        name: "repo conventions (appset depth, nodeports, secretrefs, pinning)"
        entry: scripts/ci/check-conventions.sh
        language: script
        pass_filenames: false
        stages: [pre-push]
      - id: validate
        name: "render everything (scripts/ci/validate.sh)"
        entry: scripts/ci/validate.sh
        language: system
        pass_filenames: false
        stages: [pre-push]              # slow (pulls charts) → only on push
