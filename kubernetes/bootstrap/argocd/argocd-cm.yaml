apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd

data:
  # --enable-helm → `helmCharts:` in app kustomizations. (--enable-alpha-plugins/--enable-exec went with KSOPS)
  # (immich, cert-manager). Change here = re-apply bootstrap/argocd + restart the repo-server.
  kustomize.buildOptions: --enable-alpha-plugins --enable-exec --enable-helm
