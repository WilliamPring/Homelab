apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd

data:
  # --enable-alpha-plugins → KSOPS (secrets). --enable-helm → `helmCharts:` in app kustomizations
  # (immich, cert-manager). Change here = re-apply bootstrap/argocd + restart the repo-server.
  kustomize.buildOptions: --enable-alpha-plugins --enable-helm
