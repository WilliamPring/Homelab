apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Upstream Argo CD install manifest, PINNED to a release tag. Not vendored: the whole thing
  # (CRDs, RBAC, ConfigMaps, images incl. Redis/Dex) moves together when the tag moves.
  # Renovate watches this URL (renovate.json → customManagers "argo-cd install") and opens a
  # PR per Argo release. After merging: `kubectl apply -k kubernetes/bootstrap/argocd/ -n argocd` once.
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml

patches:
  # ⚠️ config.yaml MUST be a patch, not a resource — as a resource it collided with the
  #    upstream install's empty argocd-cmd-params-cm and server.insecure got wiped on every
  #    apply, causing ERR_TOO_MANY_REDIRECTS behind any proxy. See the header in that file.
  - path: config.yaml
  # NOTE: there is deliberately no repo-server patch any more. It used to mount KSOPS, KSOPS's
  # bundled kustomize and a matching Helm 3 over Argo's own binaries. KSOPS went with the last
  # SOPS secret (Nov 2026), and with it the tool overrides — the repo-server now runs the
  # kustomize + Helm pair that ships in the Argo image, which is the pair upstream tests.
  - path: argocd-notifications-cm.yaml   # notifications → Bark (patches the empty CM from the install)
  - path: argocd-rbac-cm.yaml          # read-only role for the Homepage widget's `homepage` account
  - path: argocd-cm-patch.yaml
    target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
  # The UI's LAN fallback door: http://192.168.68.63:30443 (no Ingress, no DNS, no cert).
  # Everyday access is https://deploy.williampring.ca via NPMplus + a Cloudflare tunnel.
  # JSON-6902 on purpose — a strategic merge drops `nodePort` silently.
  - path: argocd-server-nodeport-patch.yaml
    target:
      version: v1
      kind: Service
      name: argocd-server
