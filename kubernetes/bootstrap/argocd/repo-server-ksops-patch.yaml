
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server

spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}

        - name: sops-age
          secret:
            secretName: sops-age

      initContainers:
        # Install KSOPS and its bundled Kustomize binary
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          command:
            - /usr/local/bin/ksops
            - install
            - --with-kustomize
            - /custom-tools
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools

        # Install KSOPS as a Kustomize exec plugin
        - name: install-ksops-plugin
          image: alpine:3.22
          command:
            - /bin/sh
            - -c
          args:
            - |
              mkdir -p /custom-tools/viaduct.ai/v1/ksops
              cp /custom-tools/ksops /custom-tools/viaduct.ai/v1/ksops/ksops
              chmod +x /custom-tools/viaduct.ai/v1/ksops/ksops
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools

        # Install Helm
        - name: install-helm3
          image: alpine/helm:3.22.1
          command:
            - /bin/sh
            - -c
          args:
            - cp "$(command -v helm)" /custom-tools/helm
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools

      containers:
        - name: argocd-repo-server
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /etc/sops-age/keys.txt

            - name: KUSTOMIZE_PLUGIN_HOME
              value: /custom-tools

          volumeMounts:
            # Shared tools directory
            - name: custom-tools
              mountPath: /custom-tools

            # Executables
            - name: custom-tools
              mountPath: /usr/local/bin/ksops
              subPath: ksops

            - name: custom-tools
              mountPath: /usr/local/bin/kustomize
              subPath: kustomize

            - name: custom-tools
              mountPath: /usr/local/bin/helm
              subPath: helm

            # SOPS age key
            - name: sops-age
              mountPath: /etc/sops-age/keys.txt
              subPath: keys.txt
              readOnly: true
