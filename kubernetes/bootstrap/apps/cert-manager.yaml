# Argo CD Application — cert-manager. Helm chart rendered through kustomize (app dir).
# ⚠️ SYNC ORDER: this FIRST, then 'cert-manager-issuer'. Upgrades one minor at a time (docs/platform/tls.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: kubernetes/apps/cert-manager/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    # CRDs exceed the client-side annotation limit
