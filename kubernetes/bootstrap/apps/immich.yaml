# Argo CD Application — Immich. The Helm chart is rendered THROUGH kustomize (helmCharts in the
# app dir), so this is a plain path source like every other app. Chart pin + values: the app dir.
#
# ⚠️ SYNC 'immich-prereqs' FIRST (vector Postgres + library PVC must exist).
# ⚠️ Sync stays MANUAL: a chart/app bump runs a DB migration — snapshot + pg_dump first (docs/apps/immich.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: kubernetes/apps/media/immich
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
