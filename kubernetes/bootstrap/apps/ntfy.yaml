# Argo CD Application — ntfy (push notifications). Helm chart rendered through kustomize (app dir).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: kubernetes/apps/notifications/ntfy
  destination:
    server: https://kubernetes.default.svc
    namespace: notifications
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
