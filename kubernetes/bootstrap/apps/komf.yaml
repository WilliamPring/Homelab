# Argo CD Application — Komf (metadata fetcher for Kavita). Kustomize dir + KSOPS secret.
#
# ORDER: Kavita must be up and you must have its API key encrypted into
# kubernetes/apps/media/komf/komf-secret.enc.yaml first (see the header of that file). Then Apply → SYNC.
#
# Apply by hand, once:  sudo k3s kubectl apply -f kubernetes/bootstrap/apps/komf.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: komf
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: kubernetes/apps/media/komf
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
