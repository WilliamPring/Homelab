# The ApplicationSet — discovers every app from the directory tree and creates its Argo Application.
#
#   kubernetes/apps/<namespace>/<app>/   →   Application "<app>" deploying that directory into <namespace>
#
#   add an app    = new directory + push  → appears in Argo within ~3 min (no kubectl)
#   remove an app = delete the directory  → its Application is removed; the deployed resources STAY
#                                           (no finalizer on generated apps — delete them by hand if wanted)
#
# This is the ONE Application-level object applied by hand, once:
#   sudo k3s kubectl apply -f kubernetes/bootstrap/apps.yaml
#
# ⚠️ Hand-edits to a generated Application do not stick — the controller owns and watches them, so
#    the edit itself triggers the reconcile that overwrites it. That is why the UI's "Enable
#    Auto-Sync" toggle appears not to save. Grant auto-sync HERE, then re-apply this file.
#
# Why only those four: docs/platform/argocd.md#sync-mode-manual-except-four-apps
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true     # deleting THIS object leaves the Applications in place
  generators:
    - git:
        repoURL: https://github.com/WilliamPring/Homelab.git
        revision: main
        directories:
          - path: kubernetes/apps/*/*
  template:
    metadata:
      name: "{{ .path.basename }}"                 # directory name = app name
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/WilliamPring/Homelab.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ index .path.segments 2 }}"  # kubernetes/apps/<namespace>/<app> → segment 2
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  # Per-app exceptions. Two independent flags — keep them as separate `if`s, never if/else, or an
  # app needing both silently gets one.
  # ⚠️ A merge patch REPLACES lists, so syncOptions must restate CreateNamespace=true.
  templatePatch: |
    {{- $ssa  := has .path.basename (list "cert-manager" "kube-prometheus-stack" "external-secrets") }}
    {{- $auto := has .path.basename (list "searxng" "kavita" "suwayomi" "immich-public-proxy") }}
    {{- if or $ssa $auto }}
    spec:
      syncPolicy:
        {{- if $auto }}
        automated: {}          # no selfHeal, no prune — on purpose; see the header
        {{- end }}
        syncOptions:
          - CreateNamespace=true
          {{- if $ssa }}
          - ServerSideApply=true
          {{- end }}
    {{- end }}
