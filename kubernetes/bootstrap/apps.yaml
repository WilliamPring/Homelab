# The ApplicationSet — discovers every app from the directory tree and creates its Argo Application.
#
#   kubernetes/apps/<namespace>/<app>/   →   Application "<app>" deploying that directory into <namespace>
#
#   add an app    = new directory + push  → appears in Argo within ~3 min (no kubectl)
#   remove an app = delete the directory  → its Application is removed; the deployed resources STAY
#                                           (no finalizer on generated apps — delete them by hand if wanted)
#
# This is the ONE Application-level object applied by hand, once:
#   sudo k3s kubectl apply -f kubernetes/bootstrap/apps.yaml
#
# Scope: the set automates REGISTRATION only. Every generated app has the usual manual syncPolicy —
# nothing deploys until you click Sync. Hand-edits to a generated Application spec are reverted by
# the controller: change the directory, not the object.
#
# Groups: every generated app carries a `group` label, so the apps that make up one thing show up
# together — Argo UI → Applications → filter sidebar → Labels → `group=immich` lists immich,
# immich-prereqs and immich-public-proxy (CLI: `kubectl -n argocd get applications -l group=immich`;
# `-L group` adds a GROUP column). An app's group is its own name unless templatePatch maps it into a
# family — one `if eq` line per family below. A label is metadata only: it deploys nothing and
# never makes an app OutOfSync. (A label, not an AppProject: projects are for RBAC and allowed
# destinations, which a one-person cluster doesn't need.)
#
# Per-app exceptions live in `templatePatch` (today: the group families, and cert-manager,
# kube-prometheus-stack and external-secrets need ServerSideApply — their CRDs exceed the
# client-side annotation limit). Changing templatePatch means re-applying THIS file by hand;
# nothing in git reconfigures the ApplicationSet itself.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true     # deleting THIS object leaves the Applications in place
  generators:
    - git:
        repoURL: https://github.com/WilliamPring/Homelab.git
        revision: main
        directories:
          - path: kubernetes/apps/*/*
  template:
    metadata:
      name: "{{ .path.basename }}"                 # directory name = app name
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/WilliamPring/Homelab.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ index .path.segments 2 }}"  # kubernetes/apps/<namespace>/<app> → segment 2
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
  templatePatch: |
    {{- $app := .path.basename }}
    {{- $group := $app }}
    {{- if eq $app "immich-prereqs" "immich-public-proxy" }}{{ $group = "immich" }}{{ end }}
    {{- if eq $app "cert-manager-issuer" }}{{ $group = "cert-manager" }}{{ end }}
    {{- if eq $app "external-secrets-store" }}{{ $group = "external-secrets" }}{{ end }}
    metadata:
      labels:
        group: "{{ $group }}"
    {{- if or (eq .path.basename "cert-manager") (eq .path.basename "kube-prometheus-stack") (eq .path.basename "external-secrets") }}
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
    {{- end }}
