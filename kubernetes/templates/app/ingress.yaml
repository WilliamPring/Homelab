# https://example.williampring.ca — Tailscale-only (DNS: example → A → master Tailscale IP, grey cloud).
# cert-manager issues example-tls automatically (docs/platform/tls.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example
  namespace: example-namespace
  labels:
    app: example
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - example.williampring.ca
      secretName: example-tls
  rules:
    - host: example.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example
                port:
                  number: 8080
