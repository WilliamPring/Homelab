apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
  labels:
    app: qbittorrent
spec:
  type: NodePort           # keeps a ClusterIP too → Ingress/domain still works
  selector:
    app: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080      # LAN access: http://<node-LAN-IP>:30080  (WebUI only — not the torrent traffic)
