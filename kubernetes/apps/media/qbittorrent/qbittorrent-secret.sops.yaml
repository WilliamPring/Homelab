# KSOPS generator — decrypts qbittorrent-secret.enc.yaml into the real `qbittorrent-secret` at Argo
# render time (same pattern as kubernetes/apps/media/komf/komf-secret.sops.yaml).
apiVersion: viaduct.ai/v1
kind: ksops

metadata:
  name: qbittorrent-secret
  namespace: media
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops

files:
  - ./qbittorrent-secret.enc.yaml
