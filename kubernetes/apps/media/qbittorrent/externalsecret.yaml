# qbittorrent-secret — filled by External Secrets from OpenBao (homelab/qbittorrent).
# Change a value:  bao kv patch homelab/qbittorrent KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n media annotate externalsecret qbittorrent-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: qbittorrent-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef: { key: qbittorrent, property: WIREGUARD_PRIVATE_KEY }
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef: { key: qbittorrent, property: WIREGUARD_ADDRESSES }
