# qbittorrent-secret — filled by External Secrets from OpenBao (homelab/qbittorrent).
# The last app off SOPS: its *.enc.yaml was never actually encrypted (still a placeholder
# template), so KSOPS could not decrypt it and this app failed to render. Retiring KSOPS ends that.
#
# Both values come from Mullvad → WireGuard → "Generate key" → download a config, which gives:
#   [Interface]
#   PrivateKey = <WIREGUARD_PRIVATE_KEY>
#   Address    = <WIREGUARD_ADDRESSES>      e.g. 10.66.12.34/32
# Gluetun reads them; qBittorrent itself has no network of its own (docs/apps/qbittorrent.md).
#
# Change a value:  bao kv patch homelab/qbittorrent KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n media annotate externalsecret qbittorrent-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — Gluetun reads them at start.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: qbittorrent-secret   # same name as before — the Deployment doesn't change
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef: { key: qbittorrent, property: WIREGUARD_PRIVATE_KEY }
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef: { key: qbittorrent, property: WIREGUARD_ADDRESSES }
