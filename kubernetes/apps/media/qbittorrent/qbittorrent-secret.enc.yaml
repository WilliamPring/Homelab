# ⚠️ PLAINTEXT TEMPLATE — NOT YET ENCRYPTED. Do these steps on the Arch box (it has the age key)
# BEFORE committing real values, or Argo's KSOPS step will fail to decrypt it:
#
#   1. Mullvad → https://mullvad.net/account → "WireGuard configuration" → Linux → Generate key
#      → pick any server → download the .conf. From its [Interface] section copy:
#        PrivateKey = ...          → WIREGUARD_PRIVATE_KEY
#        Address    = 10.x.x.x/32  → WIREGUARD_ADDRESSES   (IPv4 part ONLY — drop the IPv6 ",fc00::/128")
#      The server you picked does not matter: Gluetun chooses the server (SERVER_* in deployment.yaml).
#   2. Encrypt in place:   sops --encrypt --in-place kubernetes/apps/media/qbittorrent/qbittorrent-secret.enc.yaml
#   3. Verify:             sops -d kubernetes/apps/media/qbittorrent/qbittorrent-secret.enc.yaml >/dev/null && echo ENCRYPTED
#
# 🔑 Committed the key in plaintext by accident? Revoke that key on mullvad.net (it is one of your 5
#    devices), generate a new one, redo 1–3. Full workflow: docs/platform/secrets.md.
apiVersion: v1
kind: Secret
metadata:
  name: qbittorrent-secret
  namespace: media
  labels:
    app: qbittorrent
type: Opaque
stringData:
  WIREGUARD_PRIVATE_KEY: "REPLACE_ME_WITH_MULLVAD_PRIVATE_KEY"
  WIREGUARD_ADDRESSES: "REPLACE_ME_WITH_MULLVAD_ADDRESS/32"
