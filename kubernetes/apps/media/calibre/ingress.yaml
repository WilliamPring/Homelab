# Ingress → https://books.williampring.ca. cert-manager issues calibre-tls from the
# 'letsencrypt' ClusterIssuer (Cloudflare DNS-01). Add DNS: books → A → master Tailscale IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre
  namespace: media
  labels:
    app: calibre
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - books.williampring.ca
      secretName: calibre-tls
  rules:
    - host: books.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calibre
                port:
                  number: 8083
