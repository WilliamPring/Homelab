apiVersion: v1
kind: Service
metadata:
  name: calibre
  namespace: media
  labels:
    app: calibre
spec:
  type: NodePort           # NodePort also keeps a ClusterIP → the Ingress/domain still works
  selector:
    app: calibre
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083      # LAN access: http://<node-LAN-IP>:30083  (for the Kindle browser)
