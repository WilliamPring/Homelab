# immich-secret — filled by External Secrets from OpenBao (homelab/immich).
# Change a value:  bao kv patch homelab/immich KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n media annotate externalsecret immich-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: immich-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: immich, property: REDIS_PASSWORD }
