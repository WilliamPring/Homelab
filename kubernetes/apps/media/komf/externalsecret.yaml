# komf-secret — filled by External Secrets from OpenBao (homelab/komf).
# Change a value:  bao kv patch homelab/komf KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n media annotate externalsecret komf-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komf-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: komf-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: KAVITA_API_KEY
      remoteRef: { key: komf, property: KAVITA_API_KEY }
