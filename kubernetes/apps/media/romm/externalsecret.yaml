# romm-secret — filled by External Secrets from OpenBao (homelab/romm). Was SOPS (*.enc.yaml).
# Change a value:  bao kv patch homelab/romm KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n media annotate externalsecret romm-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: romm-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: ROMM_AUTH_SECRET_KEY
      remoteRef: { key: romm, property: ROMM_AUTH_SECRET_KEY }
    - secretKey: DB_PASSWD
      remoteRef: { key: romm, property: DB_PASSWD }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: romm, property: REDIS_PASSWORD }
    - secretKey: IGDB_CLIENT_ID
      remoteRef: { key: romm, property: IGDB_CLIENT_ID }
    - secretKey: IGDB_CLIENT_SECRET
      remoteRef: { key: romm, property: IGDB_CLIENT_SECRET }
    - secretKey: SCREENSCRAPER_USER
      remoteRef: { key: romm, property: SCREENSCRAPER_USER }
    - secretKey: SCREENSCRAPER_PASSWORD
      remoteRef: { key: romm, property: SCREENSCRAPER_PASSWORD }
    - secretKey: RETROACHIEVEMENTS_API_KEY
      remoteRef: { key: romm, property: RETROACHIEVEMENTS_API_KEY }
    - secretKey: STEAMGRIDDB_API_KEY
      remoteRef: { key: romm, property: STEAMGRIDDB_API_KEY }
