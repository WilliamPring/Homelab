# The cluster's connection to OpenBao: the ClusterSecretStore and the CA it trusts.
# Sync AFTER the external-secrets app (that one installs the ClusterSecretStore CRD).
# Docs: docs/platform/openbao.md §7
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - openbao-ca.yaml          # OpenBao's PUBLIC certificate (ConfigMap openbao-ca)
  - clustersecretstore.yaml
