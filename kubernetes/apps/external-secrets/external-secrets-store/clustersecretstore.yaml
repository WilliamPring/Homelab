# The ONE connection from the cluster to OpenBao. Every app's ExternalSecret points at it by name
# (`secretStoreRef: {kind: ClusterSecretStore, name: openbao}`). Docs: docs/platform/openbao.md §7
#
#   where     https://192.168.68.91:8200 — the OpenBao LXC on Proxmox, straight over the LAN.
#             Not a *.williampring.ca name, not the Cloudflare tunnel: secrets must not depend on DNS,
#             Traefik or Cloudflare being up (docs/platform/openbao.md §2 "Access").
#   trust     OpenBao's self-signed certificate, pinned from openbao-ca.crt beside this file
#             (ConfigMap openbao-ca). If the cert is ever regenerated, replace that file and Sync.
#   what      KV v2 engine mounted at `homelab`. An ExternalSecret's `key: ghostfolio` reads
#             homelab/data/ghostfolio (ESO adds the /data/ part for v2).
#   login     AppRole `eso`, read-only (policy eso-read). Its role-id + secret-id are in the Secret
#             external-secrets/openbao-approle, created BY HAND once — it is the one credential that
#             can't live in OpenBao, because it's the key to OpenBao. Command: openbao.md §7.
#
# Cluster-wide on purpose: any namespace can use it. Fine for one owner; if that ever changes, add
# spec.conditions[].namespaces to limit who may read through it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:                       # OpenBao speaks the Vault API; ESO's Vault provider works unchanged
      server: https://192.168.68.91:8200
      path: homelab
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        appRole:
          path: approle
          roleRef:
            name: openbao-approle
            namespace: external-secrets
            key: role-id
          secretRef:
            name: openbao-approle
            namespace: external-secrets
            key: secret-id
