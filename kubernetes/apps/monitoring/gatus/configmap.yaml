# Gatus config — the list of things that must be UP, and how to shout when they are not.
# Reference: https://github.com/TwiN/gatus#configuration
#
# Groups:
#   apps   — in-cluster Service URLs (exact, no DNS/TLS in the way): "is the app itself alive?"
#   edge   — the public hostnames: "does DNS + cert + the front door work?"  (+ cert expiry)
#            ⚠️ NOT all one path. Most go Cloudflare DNS → the master's Tailscale IP → Traefik →
#            a cert-manager/Let's Encrypt cert. But deploy.williampring.ca (Argo CD) goes
#            Cloudflare → TUNNEL → NPMplus → a NodePort, with NPMplus's own certbot cert, and
#            has no Ingress in this repo at all. Bark is fronted the same way. So "the edge
#            group is red" can mean two completely different outages — check which rows.
#            (The Immich share proxy, public-immich.williampring.ca, has no edge row: its
#            in-cluster check is in `apps` and its Cloudflare record in `dns`.)
#   infra  — the boxes the apps depend on: Postgres LXC, Valkey, NFS, Proxmox
#   dns    — Cloudflare records still exist
#
# ⚠️ Traefik-fronted `edge` checks resolve *.williampring.ca to the master's TAILSCALE IP from
#    inside a pod. That works when the nodes route 100.x via their own tailscale0 (they do —
#    Ansible put Tailscale on every node). If the whole edge group is red while apps are green,
#    see docs/apps/gatus.md → "edge group all red".
#
# ⚠️ Gatus cannot watch itself. If Gatus is down, nothing alerts and it looks like a quiet week.
#    Same for Bark, the only channel. LAN fallbacks, which need no DNS/cert/Traefik/tunnel:
#      Gatus   http://192.168.68.63:30881
#      Bark    http://192.168.68.63:30889
#      Argo    http://192.168.68.63:30443
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
  labels:
    app: gatus
data:
  config.yaml: |
    ui:
      title: "Homelab status"
      header: "Homelab"
      dashboard-heading: "Status"

    storage:
      type: sqlite
      path: /data/data.db
      maximum-number-of-results: 300     # per endpoint (~5h at 1m, ~25h at 5m)
      maximum-number-of-events: 100

    alerting:
      # Bark (iOS push via Apple) — the primary channel. Generic HTTP provider → Bark's POST /push.
      # BARK_DEVICE_KEY comes from the Deployment env (Gatus expands ${VAR} in this file).
      custom:
        url: "http://bark.monitoring.svc.cluster.local:8080/push"
        method: POST
        headers:
          Content-Type: application/json
        # ⚠️ `body` is a JSON literal block — a `#` inside it is NOT a comment, it is invalid
        # JSON and Gatus would fail to send every alert. Keep notes out here.
        # The "url" below is each push's tap-target. LAN fallback: http://192.168.68.63:30881
        body: |
          {
            "device_key": "${BARK_DEVICE_KEY}",
            "title": "[ALERT_TRIGGERED_OR_RESOLVED] [ENDPOINT_NAME]",
            "body": "[ENDPOINT_GROUP] — [ALERT_DESCRIPTION]",
            "level": "timeSensitive",
            "group": "homelab",
            "url": "https://status.williampring.ca"
          }
        placeholders:
          ALERT_TRIGGERED_OR_RESOLVED:
            TRIGGERED: "🔴 DOWN"
            RESOLVED: "🟢 UP"
        default-alert:
          enabled: true
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    # every endpoint below alerts to Bark via the `custom` provider above
    endpoints:
      # ── apps (inside the cluster) ─────────────────────────────────────────────────
      - name: Immich
        group: apps
        url: "http://immich-server.media.svc.cluster.local:2283/api/server/ping"
        interval: 1m
        conditions: ["[STATUS] == 200", "[BODY].res == pong"]
        alerts: [{ type: custom }]
      - name: Immich Postgres
        group: apps
        url: "tcp://immich-postgres.media.svc.cluster.local:5432"
        interval: 1m
        conditions: ["[CONNECTED] == true"]
        alerts: [{ type: custom }]
      - name: Kavita
        group: apps
        url: "http://kavita.media.svc.cluster.local:5000/api/health"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Calibre-Web
        group: apps
        url: "http://calibre.media.svc.cluster.local:8083/"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Suwayomi
        group: apps
        url: "tcp://suwayomi.media.svc.cluster.local:4567"     # HTTP would need Basic auth
        interval: 1m
        conditions: ["[CONNECTED] == true"]
        alerts: [{ type: custom }]
      - name: qBittorrent
        group: apps
        url: "http://qbittorrent.media.svc.cluster.local:8080/"   # pod is NotReady while the VPN is down → this fails too
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Karakeep
        group: apps
        url: "http://karakeep.apps.svc.cluster.local:3000/api/health"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Actual Budget
        group: apps
        url: "http://actual.apps.svc.cluster.local:5006/"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Wealthfolio
        group: apps
        # The image's own healthcheck endpoint; needs no login.
        url: "http://wealthfolio.apps.svc.cluster.local:8088/api/v1/healthz"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Immich Public Proxy
        group: apps
        url: "http://immich-public-proxy.media.svc.cluster.local:3000/share/healthcheck"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: SearXNG
        group: apps
        url: "http://searxng.apps.svc.cluster.local:8080/healthz"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: degoog
        group: apps
        url: "http://degoog.apps.svc.cluster.local:4444/"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Homepage
        group: apps
        url: "http://homepage.apps.svc.cluster.local:3000/"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Bark (push server)
        group: apps
        url: "http://bark.monitoring.svc.cluster.local:8080/ping"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: []       # ⚠️ deliberately NO alert: Bark cannot page you about Bark being down, and it
                         # is now the only channel. This endpoint is dashboard-only — watch it at
                         # https://status.williampring.ca, or add a second channel (see docs/apps/bark.md).
      - name: Argo CD
        group: apps
        url: "http://argocd-server.argocd.svc.cluster.local:80/healthz?full=true"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      # The Grafana stack. Gatus is what notices when the OTHER alerting path is down: a dead
      # Prometheus/Alertmanager/bark-relay can't page you about itself, but Gatus can.
      - name: Grafana
        group: apps
        url: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80/api/health"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Prometheus
        group: apps
        url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/ready"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Alertmanager
        group: apps
        url: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/-/ready"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Bark relay
        group: apps
        url: "http://bark-relay.monitoring.svc.cluster.local:8080/healthz"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Loki
        group: apps
        url: "http://loki.monitoring.svc.cluster.local:3100/ready"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Alloy
        group: apps
        url: "http://alloy.monitoring.svc.cluster.local:12345/-/ready"
        interval: 1m
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]

      # ── edge (DNS → Tailscale IP → Traefik → cert) ─────────────────────────────────
      - name: library.williampring.ca
        group: edge
        url: "https://library.williampring.ca/api/health"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h", "[RESPONSE_TIME] < 3000"]
        alerts: [{ type: custom }]
      - name: immich.williampring.ca
        group: edge
        url: "https://immich.williampring.ca/api/server/ping"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]
      - name: suwayomi.williampring.ca
        group: edge
        url: "https://suwayomi.williampring.ca/"
        interval: 5m
        conditions: ["[STATUS] == 401", "[CERTIFICATE_EXPIRATION] > 168h"]   # Basic auth → 401 means "up"
        alerts: [{ type: custom }]
      - name: qbittorrent.williampring.ca
        group: edge
        url: "https://qbittorrent.williampring.ca/"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]
      - name: karakeep.williampring.ca
        group: edge
        url: "https://karakeep.williampring.ca/api/health"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]
      - name: grafana.williampring.ca
        group: edge
        url: "https://grafana.williampring.ca/api/health"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]
      - name: actual.williampring.ca
        group: edge
        url: "https://actual.williampring.ca/"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]
      - name: portfolio.williampring.ca
        group: edge
        url: "https://portfolio.williampring.ca/api/v1/health"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]
      - name: wealthfolio.williampring.ca
        group: edge
        url: "https://wealthfolio.williampring.ca/api/v1/healthz"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]
      # Argo CD's public front door. Unlike every other edge check this one does NOT go
      # through Traefik or a cert-manager cert — it is NPMplus + a Cloudflare tunnel, with
      # NPMplus's own certbot cert. It is also the path a Bark notification's tap-target
      # uses (argocdUrl), so if this is red, tapping a deploy alert goes nowhere.
      # A 3xx here means server.insecure got wiped again — see bootstrap/argocd/config.yaml.
      # The phone's registration path. NOT the alert path — alerts go in-cluster, so this
      # being red does not silence alerting; it means a NEW phone could not register and
      # that NPMplus/Cloudflare is unhappy. Also NPMplus's own certbot cert, not cert-manager.
      - name: bark.williampring.ca
        group: edge
        url: "https://bark.williampring.ca/ping"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]
      - name: deploy.williampring.ca
        group: edge
        url: "https://deploy.williampring.ca/healthz?full=true"
        interval: 5m
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 168h"]
        alerts: [{ type: custom }]

      # ── infra (LXCs / hosts the apps depend on) ────────────────────────────────────
      - name: Postgres LXC
        group: infra
        url: "tcp://192.168.68.7:5432"
        interval: 1m
        conditions: ["[CONNECTED] == true"]
        alerts: [{ type: custom }]
      - name: Valkey
        group: infra
        url: "tcp://192.168.68.103:6379"
        interval: 1m
        conditions: ["[CONNECTED] == true"]
        alerts: [{ type: custom }]
      - name: NFS file server
        group: infra
        url: "tcp://192.168.68.50:2049"
        interval: 1m
        conditions: ["[CONNECTED] == true"]
        alerts: [{ type: custom }]
      - name: OpenBao (secrets)
        group: infra
        # /sys/health: 200 = unsealed + serving; 503 = SEALED (after a reboot whose auto-unseal
        # failed) — every app's Secret stops refreshing then. Cert: self-signed, made 2026-11-05 for
        # 10 years; the expiry condition is the reminder to regenerate it (docs/platform/openbao.md).
        url: "https://192.168.68.91:8200/v1/sys/health"
        interval: 1m
        client: { insecure: true }     # self-signed; ESO itself pins the cert (openbao-ca.yaml)
        conditions: ["[STATUS] == 200", "[CERTIFICATE_EXPIRATION] > 720h"]
        alerts: [{ type: custom }]
      - name: Proxmox pve (.96)
        group: infra
        url: "https://192.168.68.96:8006/"
        interval: 5m
        client: { insecure: true }     # self-signed
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]
      - name: Proxmox pve (.89)
        group: infra
        url: "https://192.168.68.89:8006/"
        interval: 5m
        client: { insecure: true }
        conditions: ["[STATUS] == 200"]
        alerts: [{ type: custom }]

      # ── dns (Cloudflare records still there) ───────────────────────────────────────
      - name: DNS library.williampring.ca
        group: dns
        url: "1.1.1.1"
        interval: 10m
        dns:
          query-name: "library.williampring.ca"
          query-type: "A"
        conditions: ["[DNS_RCODE] == NOERROR"]
        alerts: [{ type: custom }]
      # The share proxy's public hostname — what its PUBLIC_BASE_URL says
      # (kubernetes/apps/media/immich-public-proxy). share.williampring.ca is gone (NXDOMAIN).
      - name: DNS public-immich.williampring.ca
        group: dns
        url: "1.1.1.1"
        interval: 10m
        dns:
          query-name: "public-immich.williampring.ca"
          query-type: "A"
        conditions: ["[DNS_RCODE] == NOERROR"]
        alerts: [{ type: custom }]
