# Gatus — uptime checks + alerts to ntfy. The "is it up right now?" half of monitoring.
# Config = the ConfigMap (configmap.yaml). History = sqlite on a small local-path PVC.
# Dashboard: https://status.williampring.ca   Alerts: ntfy topic `homelab-alerts`.
# Docs: docs/apps/gatus.md   Upstream: https://github.com/TwiN/gatus
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: monitoring
  labels:
    app: gatus
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO sqlite volume
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
      annotations:
        # bump this (or let Argo's diff do it) when config.yaml changes so the pod reloads
        checksum/config: "see-argocd-diff"
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.37.0   # pinned — Renovate PRs bumps (grouped: stateless patch updates)
          env:
            - name: GATUS_CONFIG_PATH
              value: /config/config.yaml
            - name: TZ
              value: America/Vancouver
            - name: BARK_DEVICE_KEY            # from the Bark iOS app → server settings → device key. Inline for now.
              value: "REPLACE_ME_DEVICE_KEY"   # (a key only lets someone send pushes to your phone; move to a Secret later)
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap:
            name: gatus-config
        - name: data
          persistentVolumeClaim:
            claimName: gatus-data
