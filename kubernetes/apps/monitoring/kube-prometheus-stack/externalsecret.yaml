# kube-prometheus-stack-secret — filled by External Secrets from OpenBao (homelab/grafana).
# Change a value:  bao kv patch homelab/grafana KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n monitoring annotate externalsecret kube-prometheus-stack-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kube-prometheus-stack-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kube-prometheus-stack-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: admin-user
      remoteRef: { key: grafana, property: admin-user }
    - secretKey: admin-password
      remoteRef: { key: grafana, property: admin-password }
