# KSOPS generator — holds NO secret. It tells kustomize to decrypt the file below.
# Listed under 'generators:' in kustomization.yaml, never under 'resources:'.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: kube-prometheus-stack-secret
  namespace: monitoring
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops

files:
  - ./kube-prometheus-stack-secret.enc.yaml
