# ClusterIP for Gatus/Argo (http://bark.monitoring.svc.cluster.local:8080) + NodePort for NPMplus
# (proxy bark.williampring.ca → http://<any-node-LAN-IP>:30889). No Ingress by design —
# NPMplus owns the edge, exactly as it does for deploy.williampring.ca (Argo CD).
apiVersion: v1
kind: Service
metadata:
  name: bark
  namespace: monitoring
  labels:
    app: bark
spec:
  type: NodePort
  selector:
    app: bark
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30889      # answers on EVERY node, so any node IP works; see README port table
