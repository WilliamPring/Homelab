# SearXNG — privacy-respecting metasearch engine (single container, stateless).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: apps
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          # SearXNG tags are date+hash (no semver) → pin by DIGEST; Renovate PRs digest bumps (grouped weekly, stateless).
          image: searxng/searxng:latest@sha256:c642712fcedcdaa78fac44f71eada86aff510745826ba1bd1a368211fea2ce7f
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
