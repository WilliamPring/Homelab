# ───────────────────────────── Ops tab ─────────────────────────────
# ── Nodes: what the info-bar bars cannot show ───────────────────────────────────────
# The `kubernetes` info widget has only CPU % and RAM per node; it has no other fields.
# These tiles add, per node, from Prometheus (node-exporter + kube-state-metrics):
# root-disk %, pods on it, container restarts in 24h, uptime. node-exporter's `instance`
# is an IP:port, so each query joins node_uname_info to select the node by NAME.
- Nodes:
    - k3s-master-01:
        description: Control plane
        icon: mdi-server
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 60000      # ms; node numbers move slowly
          metrics:
            - label: Disk /
              query: 100 - 100 * sum(node_filesystem_avail_bytes{mountpoint="/"} * on(instance) group_left(nodename) node_uname_info{nodename="k3s-master-01"}) / sum(node_filesystem_size_bytes{mountpoint="/"} * on(instance) group_left(nodename) node_uname_info{nodename="k3s-master-01"})
              format: { type: number, suffix: "%", options: { maximumFractionDigits: 0 } }
            - label: Pods running
              query: count(kube_pod_info{node="k3s-master-01"} * on(namespace, pod) group_left() (kube_pod_status_phase{phase="Running"} == 1))
              format: { type: number }
            - label: Restarts 24h
              query: sum(increase(kube_pod_container_status_restarts_total[24h]) * on(namespace, pod) group_left(node) kube_pod_info{node="k3s-master-01"}) or vector(0)
              format: { type: number, options: { maximumFractionDigits: 0 } }
            - label: Uptime
              query: (time() - max(node_boot_time_seconds * on(instance) group_left(nodename) node_uname_info{nodename="k3s-master-01"})) / 86400
              format: { type: number, suffix: " d", options: { maximumFractionDigits: 1 } }

    - k3s-worker-01:
        description: 32GB worker, runs the heavy apps
        icon: mdi-server
        widget:
          type: prometheusmetric
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          refreshInterval: 60000      # ms; node numbers move slowly
          metrics:
            - label: Disk /
              query: 100 - 100 * sum(node_filesystem_avail_bytes{mountpoint="/"} * on(instance) group_left(nodename) node_uname_info{nodename="k3s-worker-01"}) / sum(node_filesystem_size_bytes{mountpoint="/"} * on(instance) group_left(nodename) node_uname_info{nodename="k3s-worker-01"})
              format: { type: number, suffix: "%", options: { maximumFractionDigits: 0 } }
            - label: Pods running
              query: count(kube_pod_info{node="k3s-worker-01"} * on(namespace, pod) group_left() (kube_pod_status_phase{phase="Running"} == 1))
              format: { type: number }
            - label: Restarts 24h
              query: sum(increase(kube_pod_container_status_restarts_total[24h]) * on(namespace, pod) group_left(node) kube_pod_info{node="k3s-worker-01"}) or vector(0)
              format: { type: number, options: { maximumFractionDigits: 0 } }
            - label: Uptime
              query: (time() - max(node_boot_time_seconds * on(instance) group_left(nodename) node_uname_info{nodename="k3s-worker-01"})) / 86400
              format: { type: number, suffix: " d", options: { maximumFractionDigits: 1 } }

    - NFS · 192.168.68.50:
        # Can the cluster reach it? `ping` = ICMP from the Homepage pod (the dot on the
        # tile). Gatus checks the real thing: TCP to the NFS port 2049 every minute, and
        # alerts Bark when it fails. The link opens that Gatus endpoint's history.
        href: https://status.williampring.ca/endpoints/infra_nfs-file-server
        description: File server for every app's data (Gatus checks NFS port 2049)
        icon: mdi-nas
        ping: 192.168.68.50

- Cluster:
    - Argo CD:
        # Fronted by NPMplus + a Cloudflare tunnel — NOT Traefik, and there is no Ingress
        # in this repo for it (same arrangement as Bark). The tunnel's Service URL must
        # point at http://<node>:30443 — plain HTTP. If it points at https, or Argo's
        # server.insecure is not live, this loops with ERR_TOO_MANY_REDIRECTS.
        #
        # ⚠️ The NodePort in the LAN fallback bookmarks is not optional: this hostname
        #    depends on Cloudflare + the tunnel + NPMplus, and Argo is the tool you need
        #    IN ORDER TO FIX a broken edge. Never delete that bookmark.
        href: https://deploy.williampring.ca
        description: GitOps deployments — sync is manual
        icon: argo-cd.png
        siteMonitor: http://argocd-server.argocd.svc.cluster.local:80/healthz?full=true
        namespace: argocd
        # ⚠️ UNVERIFIED — labels come from the upstream install manifest, not this repo.
        #      sudo k3s kubectl get pod -n argocd -l app.kubernetes.io/name=argocd-server
        # podSelector: app.kubernetes.io/name=argocd-server
        widget:
          # Token of the read-only `homepage` account (bootstrap/argocd/argocd-cm-patch.yaml
          # + argocd-rbac-cm.yaml). `outOfSync` is the number that matters here: with manual
          # sync, it is "merged but not deployed yet".
          type: argocd
          url: http://argocd-server.argocd.svc.cluster.local:80
          key: "{{HOMEPAGE_VAR_ARGOCD_KEY}}"
          fields: ["apps", "outOfSync", "healthy", "degraded"]

    - Grafana:
        # Metrics (Prometheus) + logs (Loki) + alerts (Alertmanager → Bark), one UI.
        # The widget counts Prometheus scrape targets — anything "down" is a target that
        # stopped answering (a crashed exporter, or an app whose ServiceMonitor broke).
        href: https://grafana.williampring.ca/d/homelab-apps   # straight to the per-app CPU/RAM dashboard
        description: CPU & RAM per app, logs, alert history
        icon: grafana.png
        siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80/api/health
        namespace: monitoring
        podSelector: app.kubernetes.io/name=grafana
        widget:
          type: prometheus
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

    - Status:
        href: https://status.williampring.ca
        description: Uptime checks & alerts (Gatus)
        icon: gatus.png
        siteMonitor: http://gatus.monitoring.svc.cluster.local:8080/
        namespace: monitoring
        podSelector: app=gatus
        widget:
          # No credential: Gatus's API is open in-cluster. Counts EDGE checks (DNS + cert +
          # Traefik), so "down" here with green dots elsewhere = the edge, not the apps.
          type: gatus
          url: http://gatus.monitoring.svc.cluster.local:8080

    - Bark:
        # No Ingress by design — NPMplus owns this hostname (same as deploy.*).
        # It is the ONLY alert channel, so a dead Bark looks exactly like a quiet week.
        #
        # ⚠️ This hostname is ONLY for the iPhone app's one-time registration and for
        #    this tile. Gatus and Argo push to http://bark.monitoring.svc.cluster.local
        #    instead — in-cluster, on purpose. If alerts were sent via this hostname,
        #    a Cloudflare/NPMplus outage would SILENCE the alert that tells you about it.
        href: https://bark.williampring.ca
        description: iOS push — the only alert channel
        icon: mdi-bell-ring-outline
        siteMonitor: http://bark.monitoring.svc.cluster.local:8080/ping
        namespace: monitoring
        podSelector: app=bark

- Infrastructure:
