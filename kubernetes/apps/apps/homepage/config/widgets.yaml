# The info bar — shown above every tab. Two rows, set by custom.css (at the end of this
# file), not by order alone: Homepage always groups search, clock and weather on the right
# and puts every other widget on the left in the order below. custom.css gives the right
# group a whole line (row two), so the left widgets here (logo, greeting, NFS, cluster)
# share row one. The Proxmox host bars are left out for now — see the note at the end.
#
- greeting:
    text_size: xl
    text: William's homelab
# Mullvad VPN — checks the public IP seen by the Homepage pod.
- customapi:
    label: vpn-exit pve-b (192.168.68.51)
    icon: si-mullvad
    url: https://am.i.mullvad.net/json
    refreshInterval: 30000
    method: GET
    mappings:
      - field: ip
        label: VPN IP
        format: text
      - field: country
        label: Country
        format: text
      - field: city
        label: City
        format: text

# The NFS server (192.168.68.50, every app's precious data): used / free space of its data disk,
# measured on the /data/media export (/data itself is not exported) through a read-only
# mount of it in the Homepage pod (deployment.yaml → nfs-data). Disk only, on purpose: `cpu` / `memory` here would be the k3s NODE the
# pod runs on, not the NFS box.
- resources:
    label: NFS · 192.168.68.50
    disk: /mnt/nfs
    expanded: true             # show used AND total, not just a bar

- kubernetes:
    cluster:
      show: true
      cpu: true
      memory: true
      showLabel: true
      label: cluster
    nodes:
      show: true
      cpu: true
      memory: true
      showLabel: true

- search:
    provider: custom
    url: https://search.williampring.ca/search?q=
    target: _blank
    # No `focus: true` on purpose: it would steal keystrokes from quicklaunch
    # (type anywhere → filter tiles), which is the faster way to open an app.

- datetime:
    text_size: xl
    format:
      weekday: short
      month: short
      day: numeric
      hour: numeric
      minute: 2-digit
      hourCycle: h23

- openmeteo:
    label: Toronto
    latitude: 43.6532
    longitude: -79.3832
    timezone: America/Toronto
    units: metric
    cache: 15                  # minutes — no need to hit the API on every page view

