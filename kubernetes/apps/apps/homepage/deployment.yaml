apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: apps
  labels:
    app: homepage

spec:
  replicas: 1

  selector:
    matchLabels:
      app: homepage

  template:
    metadata:
      labels:
        app: homepage

    spec:
      # Grants the read-only cluster access that kubernetes.yaml (mode: cluster) needs for
      # the cluster/node widgets and per-tile pod status. Defined in rbac.yaml.
      # Without this the pod falls back to the `default` SA and every k8s widget errors.
      serviceAccountName: homepage

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.7.0   # pinned — Renovate PRs bumps (grouped weekly, stateless)

          ports:
            - containerPort: 3000

          env:
            # Homepage answers 400 to any request whose Host header isn't listed here (or
            # localhost:3000 / 127.0.0.1:3000, always allowed) — on "/" too, not just /api.
            # The second entry is the in-cluster name Gatus's "Homepage" check uses.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.williampring.ca,homepage.apps.svc.cluster.local:3000"

            # ── widget credentials ← homepage-secret ← OpenBao homelab/homepage (externalsecret.yaml)
            # Homepage replaces "{{HOMEPAGE_VAR_X}}" in configmap.yaml with env var HOMEPAGE_VAR_X.
            # `optional: true` on every one: until the owner fills OpenBao the Secret does not exist,
            # and the dashboard must still start — only the affected widget shows an error.
            - name: HOMEPAGE_VAR_IMMICH_KEY
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_IMMICH_KEY, optional: true }
            - name: HOMEPAGE_VAR_QBITTORRENT_KEY
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_QBITTORRENT_KEY, optional: true }
            - name: HOMEPAGE_VAR_KAVITA_KEY
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_KAVITA_KEY, optional: true }
            - name: HOMEPAGE_VAR_CALIBRE_USERNAME
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_CALIBRE_USERNAME, optional: true }
            - name: HOMEPAGE_VAR_CALIBRE_PASSWORD
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_CALIBRE_PASSWORD, optional: true }
            - name: HOMEPAGE_VAR_SUWAYOMI_USERNAME
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_SUWAYOMI_USERNAME, optional: true }
            - name: HOMEPAGE_VAR_SUWAYOMI_PASSWORD
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_SUWAYOMI_PASSWORD, optional: true }
            - name: HOMEPAGE_VAR_KARAKEEP_KEY
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_KARAKEEP_KEY, optional: true }
            - name: HOMEPAGE_VAR_ARGOCD_KEY
              valueFrom:
                secretKeyRef: { name: homepage-secret, key: HOMEPAGE_VAR_ARGOCD_KEY, optional: true }

          # Exactly what the image's own HEALTHCHECK does: GET /api/healthcheck as 127.0.0.1:3000.
          # The Host header is the point — a probe otherwise arrives as <pod-ip>:3000, which the
          # allowed-hosts check above rejects with 400.
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
              httpHeaders:
                - name: Host
                  value: "127.0.0.1:3000"
            initialDelaySeconds: 10
            periodSeconds: 15

          volumeMounts:
            # Keep these as individual subPath mounts.
            # This allows Homepage to create /app/config/logs.
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml

            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml

            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml

            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml

            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml

            # Forces the info bar onto two rows (search, clock, weather take line two). See configmap.yaml.
            - name: config
              mountPath: /app/config/custom.css
              subPath: custom.css

            # The NFS share, read-only, ONLY so the `resources` widget can show its used / free
            # space (statfs). Homepage never reads the files. See widgets.yaml → "NFS".
            - name: nfs-data
              mountPath: /mnt/nfs
              readOnly: true

          resources:
            requests:
              cpu: 25m
              memory: 64Mi

            limits:
              memory: 256Mi

      volumes:
        - name: config
          configMap:
            name: homepage-config

        # Inline NFS volume, not a PV/PVC: it holds no Homepage data and nothing is written,
        # it is only measured. readOnly here AND on the mount above.
        - name: nfs-data
          nfs:
            server: "192.168.68.50"
            # /data itself is NOT exported (showmount -e lists only folders under it), so
            # mount one export. They share one disk, so any of them reports the same space.
            path: /data/media
            readOnly: true
