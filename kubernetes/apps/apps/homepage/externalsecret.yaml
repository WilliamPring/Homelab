# homepage-secret — filled by External Secrets from OpenBao (homelab/homepage).
# Holds ONLY widget credentials (read-only API keys / logins Homepage uses to show live stats).
# The property names in OpenBao are the env var names, so the chain reads straight through:
#   OpenBao homelab/homepage.HOMEPAGE_VAR_X → Secret key HOMEPAGE_VAR_X → env HOMEPAGE_VAR_X
#   → "{{HOMEPAGE_VAR_X}}" in configmap.yaml.
#
# ⚠️ ESO fills the Secret only when EVERY property below exists in OpenBao — one missing key and
#    the Secret is not created/updated (the ExternalSecret shows SecretSyncedError). Create them all
#    at once (placeholder value "unset" is fine for one you have not generated yet):
#      bao kv put homelab/homepage HOMEPAGE_VAR_IMMICH_KEY=… HOMEPAGE_VAR_QBITTORRENT_KEY=… …
#    The env vars in deployment.yaml are `optional: true`, so the dashboard runs without the Secret.
#
# Change a value:  bao kv patch homelab/homepage KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n apps annotate externalsecret homepage-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start.
# Add a key: put it in OpenBao AND list it below AND in deployment.yaml. Docs: docs/apps/homepage.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: homepage-secret
  data:
    - secretKey: HOMEPAGE_VAR_IMMICH_KEY
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_IMMICH_KEY }
    - secretKey: HOMEPAGE_VAR_QBITTORRENT_KEY
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_QBITTORRENT_KEY }
    - secretKey: HOMEPAGE_VAR_KAVITA_KEY
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_KAVITA_KEY }
    - secretKey: HOMEPAGE_VAR_CALIBRE_USERNAME
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_CALIBRE_USERNAME }
    - secretKey: HOMEPAGE_VAR_CALIBRE_PASSWORD
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_CALIBRE_PASSWORD }
    - secretKey: HOMEPAGE_VAR_SUWAYOMI_USERNAME
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_SUWAYOMI_USERNAME }
    - secretKey: HOMEPAGE_VAR_SUWAYOMI_PASSWORD
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_SUWAYOMI_PASSWORD }
    - secretKey: HOMEPAGE_VAR_KARAKEEP_KEY
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_KARAKEEP_KEY }
    - secretKey: HOMEPAGE_VAR_ARGOCD_KEY
      remoteRef: { key: homepage, property: HOMEPAGE_VAR_ARGOCD_KEY }
