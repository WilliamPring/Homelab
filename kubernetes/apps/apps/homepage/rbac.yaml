# RBAC for Homepage's Kubernetes integration (kubernetes.yaml → mode: cluster).
#
# WHAT THIS BUYS: the cluster/node CPU+memory widgets at the top of the page, and a live
# pod status on every tile that carries a `podSelector`. Without it Homepage can only do
# siteMonitor (an HTTP probe), which tells you "the app answered" but not "the pod is
# CrashLoopBackOff" or "it was OOMKilled twice".
#
# ⚠️ READ-ONLY, ON PURPOSE. `get` and `list` only — no `watch`, no `create`, no secrets.
#    A dashboard that can change the cluster is a dashboard that can break the cluster.
#    If you ever paste a wider ClusterRole from a blog, this comment is why not.
#
# ⚠️ CLUSTER-SCOPED. A ClusterRole + ClusterRoleBinding is not namespaced — deleting the
#    homepage directory removes the Application but leaves THESE behind (Argo apps have no
#    finalizer). They are in scripts/cluster-cleanup.sh's blast radius; delete by name.
#
# ⚠️ The upstream docs put the ServiceAccount in `default`. Ours is in `apps`, with the
#    rest of the app. The ClusterRoleBinding subject below must name that same namespace.
#
# No ServiceAccount token Secret is defined here on purpose: in-cluster, the kubelet
# projects a short-lived token into the pod automatically, which is what `mode: cluster`
# reads. A long-lived token Secret would be a credential sitting in etcd for no reason.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: apps
  labels:
    app: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list

  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list

  - apiGroups:
      - traefik.io
    resources:
      - ingressroutes
    verbs:
      - get
      - list

  # The cluster/node CPU + memory numbers come from here, NOT from the core API.
  # k3s bundles metrics-server; if those widgets render empty, check it is running:
  #   sudo k3s kubectl get deploy metrics-server -n kube-system
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: apps
