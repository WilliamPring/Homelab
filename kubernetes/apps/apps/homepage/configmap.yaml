# ============================================================
# Homepage ConfigMap  —  https://home.williampring.ca
# ============================================================
# The index of the homelab. Two tabs:
#   Home  — the apps you use (Media, Reading, Everyday, Money)
#   Ops   — the things that run them (Cluster, Infrastructure, bookmarks + LAN fallback)
# The info bar at the top (cluster CPU/RAM, weather, clock, search) shows on both tabs.
# Layout + rationale: docs/apps/homepage.md.
#
# ⚠️ siteMonitor URLs are IN-CLUSTER (*.svc.cluster.local), not the public hostname.
#    The probe runs from the homepage POD, not your browser — it answers "is the app
#    running?", independent of Cloudflare DNS, Tailscale and the cert. The edge is
#    Gatus's job; its endpoint list (kubernetes/apps/monitoring/gatus/configmap.yaml) is
#    where these URLs came from. Keep the two lists in step when you add an app.
#    A red dot + working link = the app is down. A green dot + dead link = the edge → Gatus.
#
# 🔑 Widget credentials are NEVER written here. A widget says `key: "{{HOMEPAGE_VAR_X}}"`;
#    Homepage substitutes the env var HOMEPAGE_VAR_X, which deployment.yaml reads from the
#    Secret `homepage-secret` ← externalsecret.yaml ← OpenBao `homelab/homepage`.
#    A key that is not in OpenBao yet = that one tile shows an API error; the rest work.
#
# ⚠️ Adding a tile is not enough. A new app needs: a tile here, a Gatus endpoint,
#    and its doc in docs/apps/. See docs/platform/adding-an-app.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: apps
  labels:
    app: homepage

data:
  settings.yaml: |
    title: Homelab
    description: William's k3s homelab
    theme: dark
    color: slate

    # A dim night-sky photo behind frosted-glass cards. Only `opacity` is used on the image:
    # the docs say background blur/saturate/brightness do not combine with `cardBlur`.
    # The image is loaded by your BROWSER from Unsplash (not by the pod). To self-host it,
    # mount a file at /app/public/images/ and use `image: /images/<file>`.
    background:
      image: https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=80
      opacity: 35
    cardBlur: md

    headerStyle: boxedWidgets      # each top-bar widget in its own glass box
    blockStyle: refined            # the little stat blocks inside service widgets
    font: plexData                 # monospace-ish digits for stats and the clock only
    iconStyle: theme               # mdi-/si- glyphs take the theme colour, not a gradient
    useEqualHeights: true          # tiles in a row line up even when one has a widget
    hideVersion: true
    disableUpdateCheck: true       # Renovate owns updates (pinned tag in deployment.yaml)

    # Every tile has a siteMonitor, so without this each one prints a response time in ms.
    # `dot` collapses it to green/red.
    statusStyle: dot

    # Type anywhere on the page to filter tiles and launch one. `provider` is inherited from
    # the search widget below (degoog), so a query that matches no tile falls through to it.
    quicklaunch:
      searchDescriptions: true
      hideVisitURL: false
      mobileButtonPosition: bottom-right

    # Shared API keys, referenced by widgets as `provider: <name>` instead of an inline key.
    # Substituted from the env var of the same name (deployment.yaml ← homepage-secret ←
    # OpenBao homelab/homepage), exactly like the "{{HOMEPAGE_VAR_X}}" keys in services.yaml:
    # the value itself is never in git. Free key: https://finnhub.io (US symbols only).
    providers:
      finnhub: "{{HOMEPAGE_VAR_FINNHUB_KEY}}"

    # Order here = order on the page, and the order of the tabs.
    # `style: column` groups sit side by side; `style: row` spans the width with N tiles across.
    layout:
      Media:
        tab: Home
        icon: mdi-play-box-multiple-outline
        style: column
      Reading:
        tab: Home
        icon: mdi-book-open-page-variant-outline
        style: column
      Everyday:
        tab: Home
        icon: mdi-compass-outline
        style: column
      Money:
        tab: Home
        icon: mdi-piggy-bank-outline
        style: column

      Cluster:
        tab: Ops
        icon: mdi-kubernetes
        style: row
        columns: 4
      Infrastructure:
        tab: Ops
        icon: mdi-server-network
        style: row
        columns: 4

      # Bookmark groups.
      Homelab:
        tab: Ops
        icon: mdi-bookmark-outline
      # No `tab:` on purpose → shown at the bottom of EVERY tab, so the raw local IPs are
      # one glance away whichever tab you are on when the edge is down.
      LAN fallback (no DNS needed):
        icon: mdi-lan
        style: row
        columns: 4

  services.yaml: |
    # ───────────────────────────── Home tab ─────────────────────────────
    - Media:
        - Immich:
            href: https://immich.williampring.ca
            description: Photo & video backup, iPhone sync
            icon: immich.png
            siteMonitor: http://immich-server.media.svc.cluster.local:2283/api/server/ping
            namespace: media
            # Chart-rendered, so NOT this repo's `app: <name>` convention. Copied from
            # immich-prereqs/services.yaml, whose NodePort Service selects exactly these.
            podSelector: app.kubernetes.io/name=server,app.kubernetes.io/instance=immich
            widget:
              type: immich
              version: 2                  # Immich ≥ v1.118 (we run v3.x)
              url: http://immich-server.media.svc.cluster.local:2283
              key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"     # API key with `server.statistics`
              fields: ["photos", "videos", "storage"]

        - Downloads:
            href: https://qbittorrent.williampring.ca
            description: Torrents, VPN-only via Mullvad (qBittorrent + Gluetun)
            icon: qbittorrent.png
            # Red whenever the VPN is down — Gluetun's kill switch makes the pod NotReady
            # on purpose, so "unreachable" here is the kill switch working, not a bug.
            siteMonitor: http://qbittorrent.media.svc.cluster.local:8080/
            namespace: media
            podSelector: app=qbittorrent
            widget:
              type: qbittorrent
              url: http://qbittorrent.media.svc.cluster.local:8080
              key: "{{HOMEPAGE_VAR_QBITTORRENT_KEY}}"  # WebUI → Authentication → API Key (qBit ≥ 5.2)
              enableLeechProgress: true

    - Reading:
        - Library:
            href: https://library.williampring.ca
            description: Manga & books reader (Kavita)
            icon: kavita.png
            siteMonitor: http://kavita.media.svc.cluster.local:5000/api/health
            namespace: media
            podSelector: app=kavita
            widget:
              type: kavita
              url: http://kavita.media.svc.cluster.local:5000
              key: "{{HOMEPAGE_VAR_KAVITA_KEY}}"     # admin user → Settings → Account → API Key

        - Books:
            href: https://books.williampring.ca
            description: Ebook ingest & metadata (Calibre-Web)
            icon: calibre-web.png
            siteMonitor: http://calibre.media.svc.cluster.local:8083/
            namespace: media
            podSelector: app=calibre
            widget:
              type: calibreweb
              url: http://calibre.media.svc.cluster.local:8083
              username: "{{HOMEPAGE_VAR_CALIBRE_USERNAME}}"
              password: "{{HOMEPAGE_VAR_CALIBRE_PASSWORD}}"
              fields: ["books", "authors", "series"]

        - Manga sources:
            href: https://suwayomi.williampring.ca
            description: Browse & subscribe to online manga (Suwayomi)
            icon: suwayomi.png
            siteMonitor: http://suwayomi.media.svc.cluster.local:4567/
            namespace: media
            podSelector: app=suwayomi
            widget:
              type: suwayomi
              url: http://suwayomi.media.svc.cluster.local:4567
              # Suwayomi's basic_auth login. Its own copy is inline in suwayomi/deployment.yaml
              # (testing stance) — this one goes through OpenBao, so it is not duplicated in git.
              username: "{{HOMEPAGE_VAR_SUWAYOMI_USERNAME}}"
              password: "{{HOMEPAGE_VAR_SUWAYOMI_PASSWORD}}"

    - Everyday:
        - Bookmarks:
            href: https://karakeep.williampring.ca
            description: Saved links with archived copies (Karakeep)
            icon: karakeep.png
            siteMonitor: http://karakeep.apps.svc.cluster.local:3000/api/health
            namespace: apps
            podSelector: app=karakeep
            widget:
              type: karakeep
              url: http://karakeep.apps.svc.cluster.local:3000
              key: "{{HOMEPAGE_VAR_KARAKEEP_KEY}}"   # User Settings → API Keys
              fields: ["bookmarks", "favorites", "highlights", "tags"]

        - degoog:
            href: https://search.williampring.ca
            description: Search aggregator (Valkey-backed)
            icon: si-google
            siteMonitor: http://degoog.apps.svc.cluster.local:4444/
            namespace: apps
            podSelector: app=degoog

        - SearXNG:
            href: https://private.williampring.ca
            description: Private metasearch
            icon: searxng.png
            siteMonitor: http://searxng.apps.svc.cluster.local:8080/healthz
            namespace: apps
            podSelector: app=searxng

    - Money:
        - Budget:
            href: https://actual.williampring.ca
            description: Envelope budgeting & sync (Actual)
            icon: actual-budget.png
            siteMonitor: http://actual.apps.svc.cluster.local:5006/
            namespace: apps
            podSelector: app=actual

        - Portfolio:
            href: https://wealthfolio.williampring.ca
            description: Stocks, ETFs & crypto (Wealthfolio)
            icon: mdi-chart-line           # no wealthfolio.png in dashboard-icons (checked: 404)
            siteMonitor: http://wealthfolio.apps.svc.cluster.local:8088/api/v1/healthz
            namespace: apps
            podSelector: app=wealthfolio

    # ───────────────────────────── Ops tab ─────────────────────────────
    - Cluster:
        - Argo CD:
            # Fronted by NPMplus + a Cloudflare tunnel — NOT Traefik, and there is no Ingress
            # in this repo for it (same arrangement as Bark). The tunnel's Service URL must
            # point at http://<node>:30443 — plain HTTP. If it points at https, or Argo's
            # server.insecure is not live, this loops with ERR_TOO_MANY_REDIRECTS.
            #
            # ⚠️ The NodePort in the LAN fallback bookmarks is not optional: this hostname
            #    depends on Cloudflare + the tunnel + NPMplus, and Argo is the tool you need
            #    IN ORDER TO FIX a broken edge. Never delete that bookmark.
            href: https://deploy.williampring.ca
            description: GitOps deployments — sync is manual
            icon: argo-cd.png
            siteMonitor: http://argocd-server.argocd.svc.cluster.local:80/healthz?full=true
            namespace: argocd
            # ⚠️ UNVERIFIED — labels come from the upstream install manifest, not this repo.
            #      sudo k3s kubectl get pod -n argocd -l app.kubernetes.io/name=argocd-server
            # podSelector: app.kubernetes.io/name=argocd-server
            widget:
              # Token of the read-only `homepage` account (bootstrap/argocd/argocd-cm-patch.yaml
              # + argocd-rbac-cm.yaml). `outOfSync` is the number that matters here: with manual
              # sync, it is "merged but not deployed yet".
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local:80
              key: "{{HOMEPAGE_VAR_ARGOCD_KEY}}"
              fields: ["apps", "outOfSync", "healthy", "degraded"]

        - Grafana:
            # Metrics (Prometheus) + logs (Loki) + alerts (Alertmanager → Bark), one UI.
            # The widget counts Prometheus scrape targets — anything "down" is a target that
            # stopped answering (a crashed exporter, or an app whose ServiceMonitor broke).
            href: https://grafana.williampring.ca/d/homelab-apps   # straight to the per-app CPU/RAM dashboard
            description: CPU & RAM per app, logs, alert history
            icon: grafana.png
            siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local:80/api/health
            namespace: monitoring
            podSelector: app.kubernetes.io/name=grafana
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

        - Status:
            href: https://status.williampring.ca
            description: Uptime checks & alerts (Gatus)
            icon: gatus.png
            siteMonitor: http://gatus.monitoring.svc.cluster.local:8080/
            namespace: monitoring
            podSelector: app=gatus
            widget:
              # No credential: Gatus's API is open in-cluster. Counts EDGE checks (DNS + cert +
              # Traefik), so "down" here with green dots elsewhere = the edge, not the apps.
              type: gatus
              url: http://gatus.monitoring.svc.cluster.local:8080

        - Bark:
            # No Ingress by design — NPMplus owns this hostname (same as deploy.*).
            # It is the ONLY alert channel, so a dead Bark looks exactly like a quiet week.
            #
            # ⚠️ This hostname is ONLY for the iPhone app's one-time registration and for
            #    this tile. Gatus and Argo push to http://bark.monitoring.svc.cluster.local
            #    instead — in-cluster, on purpose. If alerts were sent via this hostname,
            #    a Cloudflare/NPMplus outage would SILENCE the alert that tells you about it.
            href: https://bark.williampring.ca
            description: iOS push — the only alert channel
            icon: mdi-bell-ring-outline
            siteMonitor: http://bark.monitoring.svc.cluster.local:8080/ping
            namespace: monitoring
            podSelector: app=bark

    - Infrastructure:
        - Pulse:
            # Not in this cluster — Pulse runs on Proxmox. No *.svc.cluster.local to probe and
            # no podSelector; a siteMonitor here would measure the edge path rather than the
            # service. Gatus already watches both Proxmox hosts directly (its `infra` group).
            href: https://pulse.williampring.ca/
            description: Proxmox VMs, LXCs & backups (Pulse)
            icon: mdi-server-network

        - OpenBao:
            # Like Pulse, not in this cluster — an LXC on Proxmox, LAN/Tailscale only (never the
            # tunnel). Gatus's `infra` group watches /sys/health, which also catches "sealed".
            href: https://192.168.68.91:8200/ui/
            description: Secrets for every app (log in as william)
            icon: openbao.png

        - Proxmox .96:
            href: https://192.168.68.96:8006
            description: Proxmox VE host
            icon: proxmox.png

        - Proxmox .89:
            href: https://192.168.68.89:8006
            description: Proxmox VE host
            icon: proxmox.png

  kubernetes.yaml: |
    # `cluster` = read the API with the projected ServiceAccount token mounted in this pod
    # (see rbac.yaml). `default` would look for a kubeconfig, which a pod does not have.
    mode: cluster

    # ⚠️ These are SERVICE DISCOVERY toggles, not display toggles. Left on, Homepage scans
    #    Ingresses/IngressRoutes and auto-creates tiles for any that carry the annotation
    #    `gethomepage.dev/enabled: "true"`. Nothing in this repo sets that annotation, so
    #    services.yaml stays the single source of truth.
    ingress: false
    traefik: false
    gateway: false

  widgets.yaml: |
    # The info bar — shown above every tab. Order here = order left to right (it wraps).
    # Reading order: the two Proxmox HOSTS → the cluster on top of them → tickers → search,
    # clock, weather.
    #
    # ⚠️ The two glances widgets need Glances running ON EACH PROXMOX HOST — it is a host
    #    service, so Ansible or a documented manual step, never Argo (docs/apps/homepage.md
    #    → "Glances on the Proxmox hosts"). Until it is up, both render an error box.
    - glances:
        url: http://192.168.68.96:61208
        version: 4                 # `glances -V` on the host: PVE 8 (bookworm) apt ships 3.x → 3
        label: pve-a
        cpu: true
        mem: true
        disk: /
        cputemp: true              # extra API call per refresh; it is what the TEMP bar reads
        unit: metric

    - glances:
        url: http://192.168.68.89:61208
        version: 4
        label: pve-b
        cpu: true
        mem: true
        disk: /
        cputemp: true
        unit: metric

    # Real cluster numbers via metrics-server (not the old `resources` widget, which read
    # whichever node the pod happened to land on). The worker runs hot (~85% RAM), so the
    # per-node bars are the first thing to glance at. Kept on purpose: the hosts above show
    # Proxmox's view, which stays calm while a k3s node is the thing filling up.
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    # Ticker + daily % change, from Finnhub (key: settings.yaml → providers.finnhub).
    # ⚠️ The free tier is US symbols only — Canadian .TO tickers (XEQT.TO, VFV.TO) return
    #    nothing. These are the US-listed equivalents; edit the list to taste. Max 8.
    #    This is a market-wide glance, NOT your portfolio: Homepage has no Wealthfolio widget.
    - stocks:
        provider: finnhub
        color: true
        cache: 5                   # minutes — the free tier is rate-limited per minute
        watchlist:
          - VTI
          - VXUS
          - VT

    - search:
        provider: custom
        url: https://search.williampring.ca/search?q=
        target: _blank
        # No `focus: true` on purpose: it would steal keystrokes from quicklaunch
        # (type anywhere → filter tiles), which is the faster way to open an app.

    - datetime:
        text_size: xl
        format:
          weekday: short
          month: short
          day: numeric
          hour: numeric
          minute: 2-digit
          hourCycle: h23

    - openmeteo:
        label: Toronto
        latitude: 43.6532
        longitude: -79.3832
        timezone: America/Toronto
        units: metric
        cache: 15                  # minutes — no need to hit the API on every page view

  bookmarks.yaml: |
    - Homelab:
        - Repo:
            - icon: github.png
              href: https://github.com/WilliamPring/Homelab
              description: WilliamPring/Homelab

        - Argo CD (LAN):
            - icon: argo-cd.png
              href: http://192.168.68.63:30443
              description: 192.168.68.63:30443

        - Gatus (LAN):
            - icon: gatus.png
              href: http://192.168.68.63:30881
              description: 192.168.68.63:30881

    # LAN fallback — every app also listens on a NodePort, reachable by raw IP with no
    # DNS, no Cloudflare, no Tailscale and no cert. This is what you use when the tiles
    # are all dead but `kubectl get pods` looks fine: the apps are up, the edge is not.
    # Ports come from the README port table; keep them in step.
    #
    # ⚠️ .63 = k3s-master-01, .62 = k3s-worker-01. Use http://192.168.68.62:<port> if .63 is down.
    #
    # ℹ️ WHY THE MASTER IP WORKS EVEN FOR APPS PINNED TO THE WORKER. No Service in this repo sets
    #    `externalTrafficPolicy: Local`; the default `Cluster` makes kube-proxy on ANY node forward
    #    a NodePort to wherever the pod is.
    #    🛑 Add `externalTrafficPolicy: Local` to a Service and its NodePort STOPS answering on .63.
    #
    # 🛑 THESE IPs HAVE MOVED BEFORE (the master was .93 until a DHCP lease change). Symptom:
    #    every link here dies at once while `kubectl get pods` is healthy. Set DHCP
    #    RESERVATIONS for both nodes, then re-check:  sudo k3s kubectl get nodes -o wide
    #
    # ⚠️ Plain http, LAN only. Not reachable over Tailscale (192.168.68.x is not routed).
    - LAN fallback (no DNS needed):
        # 🛑 Argo CD first, because it is the one you need when everything else is broken.
        - Argo CD:
            - abbr: "ACD"
              href: http://192.168.68.63:30443
              description: 192.168.68.63:30443

        - Immich:
            - abbr: "IMM"
              href: http://192.168.68.63:30041
              description: 192.168.68.63:30041

        - Immich shares:
            - abbr: "IPP"
              href: http://192.168.68.63:30042
              description: 192.168.68.63:30042

        - degoog:
            - abbr: "DEG"
              href: http://192.168.68.63:30882
              description: 192.168.68.63:30882

        - qBittorrent:
            - abbr: "QBT"
              href: http://192.168.68.63:30080
              description: 192.168.68.63:30080

        - Calibre-Web:
            - abbr: "CAL"
              href: http://192.168.68.63:30083
              description: 192.168.68.63:30083

        - Karakeep:
            - abbr: "KRK"
              href: http://192.168.68.63:30300
              description: 192.168.68.63:30300

        - Suwayomi:
            - abbr: "SUW"
              href: http://192.168.68.63:30456
              description: 192.168.68.63:30456

        - Kavita:
            - abbr: "KAV"
              href: http://192.168.68.63:30500
              description: 192.168.68.63:30500

        - Actual:
            - abbr: "ACT"
              href: http://192.168.68.63:30506
              description: 192.168.68.63:30506

        - SearXNG:
            - abbr: "SRX"
              href: http://192.168.68.63:30880
              description: 192.168.68.63:30880

        - Gatus:
            - abbr: "GTS"
              href: http://192.168.68.63:30881
              description: 192.168.68.63:30881

        - Bark:
            - abbr: "BRK"
              href: http://192.168.68.63:30889
              description: 192.168.68.63:30889
