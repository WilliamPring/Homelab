# ⚠️ CLEARTEXT IN GIT — a deliberate choice while testing, matching the stance in CLAUDE.md.
# The values below are real and random, but they are NOT encrypted, and kustomization.yaml applies
# this file as a plain `resources:` entry rather than through the KSOPS generator. (KSOPS cannot be
# pointed at an unencrypted file: `sops -d` errors out, which is what caused "secret not found".)
#
# TO SWITCH TO SOPS — on the Arch box (it has the age key), three steps:
#   1. Rotate both values, since these have been in git in the clear:
#        NEXTAUTH_SECRET:   openssl rand -base64 36
#        MEILI_MASTER_KEY:  openssl rand -base64 36 | tr -dc 'A-Za-z0-9'
#   2. Encrypt in place:  sops --encrypt --in-place kubernetes/apps/apps/karakeep/karakeep-secret.enc.yaml
#                         (.sops.yaml at repo root matches *.enc.yaml → uses your age key)
#   3. In kustomization.yaml: drop this file from `resources:` and restore the `generators:` block.
#
# Afterwards: to change a value,  sops kubernetes/apps/apps/karakeep/karakeep-secret.enc.yaml
#
# Neither value protects anything outside the cluster: NEXTAUTH_SECRET signs session cookies
# (changing it just logs you out) and MEILI_MASTER_KEY is the password between two containers in
# this same pod. That is why cleartext is tolerable HERE and not, say, for a Mullvad key.
#
# What they do:
#   NEXTAUTH_SECRET   signs your login session cookies. Changing it logs everyone out — nothing worse.
#   MEILI_MASTER_KEY  the password between karakeep and meilisearch. It is read by BOTH containers,
#                     so they must see the same value — that is why it is one key used twice, not two.
#                     Changing it is safe: re-index from Karakeep's Admin page afterwards.
#
# 🔑 If you ever commit this file with real values in plaintext, regenerate both and redo steps 1–2.
#    Full workflow: docs/platform/secrets.md.
apiVersion: v1
kind: Secret
metadata:
  name: karakeep-secret
  namespace: apps
  labels:
    app: karakeep
type: Opaque
stringData:
  NEXTAUTH_SECRET: "zMug99jEr0WtS2P1tqEx85k0v8UhMd3xMBEi2+LVA816W2HJ"
  MEILI_MASTER_KEY: "AxEsyIpUG1xfMsGmXRfJOcIEzPauSzJXgoN6RCMzS0lCvg"
