# ⚠️ CLEARTEXT IN A PUBLIC REPO — known, accepted for now, scheduled to be fixed.
# The values below are real and NOT encrypted. kustomization.yaml applies this file as a plain
# `resources:` entry rather than through the KSOPS generator. (KSOPS cannot be pointed at an
# unencrypted file: `sops -d` errors out, which is what caused "secret not found".)
#
# ⚠️ CORRECTION to what this header used to claim. It said "neither value protects anything
# outside the cluster", and that reasoning assumed a PRIVATE repo. This repo is PUBLIC, so:
#
#   NEXTAUTH_SECRET is what signs Karakeep's login cookies. Anyone holding it can FORGE a valid
#   session and get in without a password. The only thing still in the way is the network:
#   Karakeep answers on Tailscale and the LAN, never the open internet. So this is a removed
#   lock behind a door that is still locked — not an emergency, but not "protects nothing".
#
#   MEILI_MASTER_KEY is the password between karakeep and meilisearch inside this pod. Cheap.
#
# These are already public and already in git history, so they stay readable forever whatever
# happens next. Rotating is what fixes it; deleting is not.
#
# TO ROTATE + ENCRYPT — on the Arch box (it has the age key). Two commands:
#   ./scripts/secrets.sh rotate karakeep NEXTAUTH_SECRET MEILI_MASTER_KEY
#   ./scripts/secrets.sh encrypt karakeep
# then in kustomization.yaml drop this file from `resources:` and restore the `generators:` block
# (both lines are already written there, commented, ready to swap).
# Afterwards: Sync, then `kubectl rollout restart deploy/karakeep -n apps`. You will be logged out
# of Karakeep once; log back in. Re-index from Karakeep's Admin page after a MEILI key change.
#
# Day to day once encrypted:  ./scripts/secrets.sh edit karakeep
#
# What they do:
#   NEXTAUTH_SECRET   signs your login session cookies. Changing it logs everyone out — nothing worse.
#   MEILI_MASTER_KEY  the password between karakeep and meilisearch. It is read by BOTH containers,
#                     so they must see the same value — that is why it is one key used twice, not two.
#                     Changing it is safe: re-index from Karakeep's Admin page afterwards.
#
# 🔑 If you ever commit this file with real values in plaintext, regenerate both and redo steps 1–2.
#    Full workflow: docs/platform/secrets.md.
apiVersion: v1
kind: Secret
metadata:
  name: karakeep-secret
  namespace: apps
  labels:
    app: karakeep
type: Opaque
stringData:
  NEXTAUTH_SECRET: "zMug99jEr0WtS2P1tqEx85k0v8UhMd3xMBEi2+LVA816W2HJ"
  MEILI_MASTER_KEY: "AxEsyIpUG1xfMsGmXRfJOcIEzPauSzJXgoN6RCMzS0lCvg"
