# ⚠️ PLAINTEXT TEMPLATE — NOT YET ENCRYPTED. Do these two steps on the Arch box (it has the
# age key) BEFORE committing, or Argo's KSOPS step will fail to decrypt it:
#
#   1. Generate both values (they are random — nobody has to remember them):
#        NEXTAUTH_SECRET:   openssl rand -base64 36
#        MEILI_MASTER_KEY:  openssl rand -base64 36 | tr -dc 'A-Za-z0-9'
#      Paste them in below, replacing the REPLACE_ME lines.
#
#   2. Encrypt in place:  sops --encrypt --in-place kubernetes/apps/apps/karakeep/karakeep-secret.enc.yaml
#                         (.sops.yaml at repo root matches *.enc.yaml → uses your age key)
#
# Afterwards both values are ciphertext and the file is safe to commit.
# To change one later:  sops kubernetes/apps/apps/karakeep/karakeep-secret.enc.yaml  (decrypt → edit → re-encrypt)
#
# What they do:
#   NEXTAUTH_SECRET   signs your login session cookies. Changing it logs everyone out — nothing worse.
#   MEILI_MASTER_KEY  the password between karakeep and meilisearch. It is read by BOTH containers,
#                     so they must see the same value — that is why it is one key used twice, not two.
#                     Changing it is safe: re-index from Karakeep's Admin page afterwards.
#
# 🔑 If you ever commit this file with real values in plaintext, regenerate both and redo steps 1–2.
#    Full workflow: docs/platform/secrets.md.
apiVersion: v1
kind: Secret
metadata:
  name: karakeep-secret
  namespace: apps
  labels:
    app: karakeep
type: Opaque
stringData:
  NEXTAUTH_SECRET: "REPLACE_ME_WITH_OPENSSL_RAND_BASE64_36"
  MEILI_MASTER_KEY: "REPLACE_ME_WITH_ALPHANUMERIC_RANDOM_KEY"
