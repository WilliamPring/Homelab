# https://karakeep.williampring.ca — Tailscale-only (DNS: karakeep → A → master Tailscale IP, grey cloud).
# This is the address NEXTAUTH_URL names, so it is the one to prefer. The NodePort still works for login:
# Karakeep's AUTH_TRUSTED_ORIGINS defaults to "*", so it accepts whatever address the request arrived on.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: karakeep
  namespace: apps
  labels:
    app: karakeep
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - karakeep.williampring.ca
      secretName: karakeep-tls
  rules:
    - host: karakeep.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: karakeep
                port:
                  number: 3000
