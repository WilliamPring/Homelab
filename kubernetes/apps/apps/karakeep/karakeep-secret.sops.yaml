# KSOPS generator — decrypts karakeep-secret.enc.yaml into the real `karakeep-secret` at Argo
# render time (same pattern as kubernetes/apps/media/komf/komf-secret.sops.yaml).
apiVersion: viaduct.ai/v1
kind: ksops

metadata:
  name: karakeep-secret
  namespace: apps
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops

files:
  - ./karakeep-secret.enc.yaml
