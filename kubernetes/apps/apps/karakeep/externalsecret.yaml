# karakeep-secret — filled by External Secrets from OpenBao (homelab/karakeep). Was SOPS (*.enc.yaml).
# Change a value:  bao kv patch homelab/karakeep KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n apps annotate externalsecret karakeep-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: karakeep-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: NEXTAUTH_SECRET
      remoteRef: { key: karakeep, property: NEXTAUTH_SECRET }
    - secretKey: MEILI_MASTER_KEY
      remoteRef: { key: karakeep, property: MEILI_MASTER_KEY }
