# wealthfolio-secret — SOPS-encrypted. Created by scripts/secrets.sh.
# ⚠️ PLAINTEXT TEMPLATE — fill + encrypt on the Arch box (it has the age key) BEFORE committing,
# or Argo's KSOPS step fails to decrypt it. Never commit this file while it is plaintext.
#
#   1. WF_SECRET_KEY — 32 bytes. Do NOT use '=-' (that makes 48 chars, which the app rejects):
#        ./scripts/secrets.sh set wealthfolio WF_SECRET_KEY="$(openssl rand -base64 32)"
#   2. WF_AUTH_PASSWORD_HASH — an Argon2id hash of the password you will log in with
#      (Arch: pacman -S argon2). Single quotes keep the shell off the $ signs:
#        printf '%s' 'your-password' | argon2 "$(openssl rand -hex 8)" -id -e
#        ./scripts/secrets.sh set wealthfolio WF_AUTH_PASSWORD_HASH='$argon2id$v=19$m=…'
#   3. ./scripts/secrets.sh encrypt wealthfolio
apiVersion: v1
kind: Secret
metadata:
  name: wealthfolio-secret
  namespace: apps
  labels:
    app: wealthfolio
type: Opaque
stringData:
  WF_SECRET_KEY: "REPLACE_ME"
  WF_AUTH_PASSWORD_HASH: "REPLACE_ME"
