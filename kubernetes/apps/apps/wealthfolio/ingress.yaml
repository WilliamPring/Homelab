# https://wealthfolio.williampring.ca — Tailscale-only (DNS: wealthfolio → A → master Tailscale IP, grey cloud).
# This hostname must match WF_CORS_ALLOW_ORIGINS in deployment.yaml, or login fails with a CORS error.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wealthfolio
  namespace: apps
  labels:
    app: wealthfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wealthfolio.williampring.ca
      secretName: wealthfolio-tls
  rules:
    - host: wealthfolio.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wealthfolio
                port:
                  number: 8088
