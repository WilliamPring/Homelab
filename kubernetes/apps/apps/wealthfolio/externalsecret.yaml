# wealthfolio-secret — filled by External Secrets from OpenBao (homelab/wealthfolio). Was SOPS (*.enc.yaml).
# Change a value:  bao kv patch homelab/wealthfolio KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n apps annotate externalsecret wealthfolio-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wealthfolio-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: wealthfolio-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: WF_SECRET_KEY
      remoteRef: { key: wealthfolio, property: WF_SECRET_KEY }
    - secretKey: WF_AUTH_PASSWORD_HASH
      remoteRef: { key: wealthfolio, property: WF_AUTH_PASSWORD_HASH }
