# Ingress → https://search.williampring.ca. cert-manager auto-issues degoog-tls from
# the 'letsencrypt' ClusterIssuer (Cloudflare DNS-01). That ClusterIssuer + the
# cloudflare-api-token secret stay INFRA (Ansible tls_ingress role) — shared cluster-wide.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: degoog
  namespace: apps
  labels:
    app: degoog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - search.williampring.ca
      secretName: degoog-tls
  rules:
    - host: search.williampring.ca
      http:
        paths:
          # MCP sidecar (degoog-mcp) — longest-prefix wins over /, TLS reuses
          # the existing degoog-tls secret. /mcp requires the Bearer token.
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: degoog-mcp
                port:
                  number: 4443
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: degoog-mcp
                port:
                  number: 4443
          - path: /
            pathType: Prefix
            backend:
              service:
                name: degoog
                port:
                  number: 4444
