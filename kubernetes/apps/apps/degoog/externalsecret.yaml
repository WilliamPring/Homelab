# degoog-secret — filled by External Secrets from OpenBao (homelab/degoog). Was SOPS (*.enc.yaml).
# Change a value:  bao kv patch homelab/degoog KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n apps annotate externalsecret degoog-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: degoog-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: degoog-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: DEGOOG_SETTINGS_PASSWORDS
      remoteRef: { key: degoog, property: DEGOOG_SETTINGS_PASSWORDS }
