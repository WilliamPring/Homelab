# https://portfolio.williampring.ca — Tailscale-only (DNS: portfolio → A → master Tailscale IP,
# grey cloud / DNS-only). This is the ONLY way in: there is no NodePort (see service.yaml).
#
# The hostname says what it DOES, like library (Kavita) and roms (RomM) — the app/directory keeps
# the product name `ghostfolio` so the image, the Argo app and the docs all agree.
#
# ⚠️ On your phone this is a PWA — it has to REACH the server to load, like the old ntfy app did.
# Tailscale must be up. There is no push fallback the way Bark has one (docs/apps/bark.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghostfolio
  namespace: apps
  labels:
    app: ghostfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - portfolio.williampring.ca
      secretName: ghostfolio-tls
  rules:
    - host: portfolio.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghostfolio
                port:
                  number: 3333
