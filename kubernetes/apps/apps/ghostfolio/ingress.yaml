# https://ghostfolio.williampring.ca — Tailscale-only (DNS: ghostfolio → A → master Tailscale IP,
# grey cloud / DNS-only). This is the ONLY way in: there is no NodePort (see service.yaml).
#
# ⚠️ On your phone this is a PWA — it has to REACH the server to load, like the old ntfy app did.
# Tailscale must be up. There is no push fallback the way Bark has one (docs/apps/bark.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghostfolio
  namespace: apps
  labels:
    app: ghostfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ghostfolio.williampring.ca
      secretName: ghostfolio-tls
  rules:
    - host: ghostfolio.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ghostfolio
                port:
                  number: 3333
