# ghostfolio-secret — filled by External Secrets from OpenBao (homelab/ghostfolio). Was SOPS (*.enc.yaml).
# Change a value:  bao kv patch homelab/ghostfolio KEY=…  → ESO updates the Secret within the hour
#   (now: kubectl -n apps annotate externalsecret ghostfolio-secret force-sync=$(date +%s) --overwrite),
#   then restart the pod — env vars are read at start, same as before.
# Add a key: put it in OpenBao AND list it below. Docs: docs/platform/openbao.md
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ghostfolio-secret  # same name as before — the Deployment doesn't change
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: ghostfolio, property: DATABASE_URL }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: ghostfolio, property: REDIS_PASSWORD }
    - secretKey: ACCESS_TOKEN_SALT
      remoteRef: { key: ghostfolio, property: ACCESS_TOKEN_SALT }
    - secretKey: JWT_SECRET_KEY
      remoteRef: { key: ghostfolio, property: JWT_SECRET_KEY }
