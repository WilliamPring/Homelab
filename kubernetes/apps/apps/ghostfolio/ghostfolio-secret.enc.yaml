# ghostfolio-secret — SOPS-encrypted (template: values are REPLACE_ME until you fill them in).
#
# ⚠️ FILL THESE IN ON THE ARCH BOX, which is where the age key lives. Do NOT paste real values
# while on a machine that cannot encrypt — this repo is PUBLIC, and a plaintext push is permanent.
#
#   ./scripts/secrets.sh set ghostfolio REDIS_PASSWORD=- ACCESS_TOKEN_SALT=- JWT_SECRET_KEY=-
#   ./scripts/secrets.sh set ghostfolio DATABASE_URL='postgresql://ghostfolio:<PG_PASS>@192.168.68.7:5432/ghostfolio?connect_timeout=300'
#   ./scripts/secrets.sh encrypt ghostfolio
#
# ('-' tells the script to generate a strong random value. The last step verifies the file
#  really decrypts before it says it worked.)
#
# What each value is:
#
#   DATABASE_URL       One URL, because that is the only form Ghostfolio accepts — and it
#                      contains the Postgres password, which is why the whole string is a secret
#                      rather than being assembled from parts in deployment.yaml.
#                      <PG_PASS> is printed by scripts/postgres-ghostfolio-setup.sh when you run
#                      it on the Postgres LXC (192.168.68.7). connect_timeout=300 is there for
#                      the first boot, which runs Prisma migrations before answering.
#
#   REDIS_PASSWORD     Used TWICE on purpose: ghostfolio-valkey starts with
#                      `--requirepass $REDIS_PASSWORD`, and ghostfolio connects with it. One key,
#                      two consumers — they must match, so it is one value, not two.
#
#   ACCESS_TOKEN_SALT  Hashes the security token you log in with. ⚠️ Changing it INVALIDATES
#                      every existing token: you would have to create a new Ghostfolio user and
#                      re-enter your data. Generate once, then leave it alone.
#
#   JWT_SECRET_KEY     Signs session JWTs. Changing it just logs you out — harmless.
#
# Rotating later:  ./scripts/secrets.sh rotate ghostfolio JWT_SECRET_KEY
# (all four are self-contained EXCEPT DATABASE_URL, whose password also lives in Postgres —
#  change it there first with ALTER ROLE, or you have just locked the app out. See secrets.md §6.)
