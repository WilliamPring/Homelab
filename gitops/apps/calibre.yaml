# Argo CD Application — Calibre-Web-Automated (ebook library/reader). Raw manifests.
# NFS library on the file-server LXC (like Immich). Apply → SYNC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calibre
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: gitops/calibre
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
