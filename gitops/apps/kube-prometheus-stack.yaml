# Argo CD Application — kube-prometheus-stack (METRICS, Phase 2).
# Prometheus + node-exporter + kube-state-metrics. Bundled Grafana disabled (we reuse ours).
#
# Apply:  sudo k3s kubectl apply -f gitops/apps/kube-prometheus-stack.yaml   → then SYNC.
# ⚠️ Heavier than the logging apps — watch RAM on the 16GB node on first sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      # PINNED (Argo can't resolve "*" for Helm charts). chart 88.4.0 = operator v0.93.1.
      # Verify/bump: helm show chart prometheus-community/kube-prometheus-stack | grep '^version'
      targetRevision: "88.5.2"
      helm:
        valueFiles:
          - $values/gitops/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/WilliamPring/Homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true    # the Prometheus Operator CRDs are large — SSA avoids the
                                # "metadata.annotations too long" apply error
