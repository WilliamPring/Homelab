# Argo CD Application — Loki (log store), step 1 of 3 for the logging stack.
# Multi-source Helm app (chart from grafana repo + values from git), same shape as vaultwarden.
#
# Apply:  sudo k3s kubectl apply -f gitops/apps/loki.yaml   → then SYNC in the UI.
# Sync THIS first; Alloy + Grafana come after (they point at the 'loki' service).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      # PINNED — Argo can't reliably resolve "*" for a Helm CHART source (it errors
      # "failed to resolve revision"); a concrete version is required. 7.3.0 supports the
      # Monolithic deploymentMode. Verify/bump with: helm show chart grafana/loki | grep version
      targetRevision: "7.3.0"
      helm:
        valueFiles:
          - $values/gitops/loki/values.yaml
    - repoURL: https://github.com/WilliamPring/Homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
