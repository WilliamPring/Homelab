# Argo CD Application — RomM (ROM library + in-browser play). Kustomize dir + KSOPS secret.
#
# BEFORE SYNC: (1) romm db/user on the Postgres LXC (scripts/postgres-romm-setup.sh),
# (2) romm ACL user on Valkey, (3) NFS dirs on the file server, (4) romm-secret.enc.yaml
# filled + encrypted. See docs/romm.md. Then Apply → SYNC.
#
# Apply by hand, once:  sudo k3s kubectl apply -f gitops/apps/romm.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: romm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: gitops/romm
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
