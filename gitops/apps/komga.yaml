# Argo CD Application — Komga (manga/comic server). Raw manifests.
# NFS manga library on the file-server LXC (like Immich/Calibre). Apply → SYNC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: komga
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: gitops/komga
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
