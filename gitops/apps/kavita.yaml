# Argo CD Application — Kavita (manga + comics + ebooks, one app). Raw manifests.
# NFS library on the file-server LXC (like Immich/Calibre). Apply → SYNC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kavita
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: gitops/kavita
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
