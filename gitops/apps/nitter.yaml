apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nitter
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: gitops/nitter

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true