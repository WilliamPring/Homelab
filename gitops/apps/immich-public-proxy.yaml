apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-public-proxy
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/WilliamPring/Homelab.git
    targetRevision: main
    path: gitops/immich/immich-public-proxy

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    syncOptions:
      - CreateNamespace=true