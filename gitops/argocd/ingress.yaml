# Ingress for the Argo CD UI → https://argocd.williampring.ca
#
# ⚠️ REQUIRES argocd-server in INSECURE mode (config.yaml in this folder) — it serves plain
#    HTTP so Traefik can terminate TLS at the edge, otherwise you get ERR_TOO_MANY_REDIRECTS.
#    Applying gitops/argocd/ handles both; just restart the server afterwards:
#      sudo k3s kubectl rollout restart deploy/argocd-server -n argocd
#
# cert-manager auto-issues argocd-tls from the 'letsencrypt' ClusterIssuer (Cloudflare
# DNS-01) — same as the app Ingresses.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd.williampring.ca
      secretName: argocd-tls
  rules:
    - host: argocd.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80          # http (insecure mode). NOT 443.
