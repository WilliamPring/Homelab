# Argo CD server config — makes 'insecure mode' declarative instead of a manual patch.
# argocd-server serves plain HTTP so Traefik/Ingress can terminate TLS (no redirect loop).
#
# Apply the whole folder at once:  sudo k3s kubectl apply -f gitops/argocd/
# Then restart the server:          sudo k3s kubectl rollout restart deploy/argocd-server -n argocd
#
# NOTE: `kubectl apply` MERGES this key into the ConfigMap — it won't wipe other keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"