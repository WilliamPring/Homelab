# Ingress → https://manga.williampring.ca. cert-manager issues komga-tls from the
# 'letsencrypt' ClusterIssuer (Cloudflare DNS-01). DNS: manga → A → master Tailscale IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: komga
  namespace: media
  labels:
    app: komga
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - manga.williampring.ca
      secretName: komga-tls
  rules:
    - host: manga.williampring.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: komga
                port:
                  number: 25600
