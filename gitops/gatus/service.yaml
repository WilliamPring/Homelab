apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: monitoring
  labels:
    app: gatus
spec:
  type: NodePort           # keeps a ClusterIP too → Ingress/domain still works
  selector:
    app: gatus
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30880      # LAN: http://<node-LAN-IP>:30880
