replicaCount: 1

autoscaling:
  minReplicas: 1
  maxReplicas: 2

service:
  type: ClusterIP
  port: 80

config:
  base-url: "https://ntfy.williampring.ca"
  upstream-base-url: "https://ntfy.sh"

ingress:
  enabled: true
  className: traefik

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

  hosts:
    - host: ntfy.williampring.ca
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: ntfy-tls
      hosts:
        - ntfy.williampring.ca

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi