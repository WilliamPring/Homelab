# kube-prometheus-stack — METRICS (Phase 2). GitOps copy (fed via valueFiles).
#   Prometheus (scrape+store) + node-exporter (node CPU/RAM/disk) + kube-state-metrics
#   (pod restarts, OOMKills, deployment health) + the Prometheus Operator + CRDs.
#
# KEY DECISION: this chart's BUNDLED Grafana is the SINGLE Grafana for the whole homelab.
# It auto-wires the Prometheus datasource + ships all the k8s/node dashboards. We add Loki
# as an extra datasource so this one Grafana serves BOTH logs and metrics. (The old
# standalone Grafana app was retired — see git history / gitops/apps/grafana.yaml removal.)

# ── the single Grafana (logs + metrics + dashboards) ────────────────────────────────
grafana:
  enabled: true
  # admin creds from the hand-made secret (out of git):
  #   sudo k3s kubectl create secret generic grafana-admin -n monitoring \
  #     --from-literal=admin-user=admin --from-literal=admin-password='YOURPASSWORD'
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  # Prometheus datasource is auto-wired by this chart; add Loki alongside it.
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
  # expose at https://grafana.williampring.ca (cert-manager issues grafana-tls)
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - grafana.williampring.ca
    tls:
      - hosts:
          - grafana.williampring.ca
        secretName: grafana-tls
  # default k8s/node dashboards auto-load (defaultDashboardsEnabled: true by default)

# ── Alertmanager: OFF for now (Phase 3 enables it + wires ntfy) ─────────────────────
alertmanager:
  enabled: false

# ── node metrics (DaemonSet — runs on every node) ───────────────────────────────────
nodeExporter:
  enabled: true
kube-state-metrics:
  enabled: true

# ── Prometheus itself — modest for a homelab ────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 15d                      # keep 15 days of metrics
    # scrape ServiceMonitors/PodMonitors from ALL namespaces, not just labeled ones
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi                     # ⚠️ watch the 16GB node; pin to the worker if tight
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
