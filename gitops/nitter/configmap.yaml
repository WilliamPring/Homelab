apiVersion: v1
kind: ConfigMap
metadata:
  name: nitter-config
  namespace: apps
data:
  nitter.conf: |
    [Server]
    hostname = "nitter.williampring.ca"
    title = "Nitter"
    address = "0.0.0.0"
    port = 8080
    https = false
    httpMaxConnections = 100
    staticDir = "./public"

    [Cache]
    listMinutes = 240
    rssMinutes = 10
    redisHost = "nitter-valkey"
    redisPort = 6379
    redisPassword = ""
    redisConnections = 20
    redisMaxConnections = 30

    [Config]
    hmacKey = "CHANGE_ME"
    base64Media = false

    enableRSS = true
    enableRSSUserTweets = true
    enableRSSUserReplies = true
    enableRSSUserMedia = true
    enableRSSSearch = true
    enableRSSList = true

    enableDebug = false

    proxy = ""
    proxyAuth = ""
    apiProxy = ""

    disableTid = false

    maxConcurrentReqs = 2
    maxRetries = 1
    retryDelayMs = 150

    [Preferences]
    theme = "Nitter"
    replaceTwitter = "nitter.williampring.ca"
    replaceYouTube = "piped.video"
    replaceReddit = "redlib.williampring.ca"
    proxyVideos = true
    hlsPlayback = false
    infiniteScroll = false