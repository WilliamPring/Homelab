# ⚠️ PLAINTEXT TEMPLATE — NOT YET ENCRYPTED. On the Arch box (it has the age key), BEFORE committing:
#
#   1. ROMM_AUTH_SECRET_KEY   →  openssl rand -hex 32
#   2. DB_PASSWD              →  printed by scripts/postgres-romm-setup.sh (run it in the Postgres LXC)
#   3. REDIS_PASSWORD         →  the password you set with ACL SETUSER romm on the Valkey host (docs/romm.md)
#   4. Provider keys          →  optional. Leave "" to keep that provider off. Hasheous + PlayMatch
#                                need no key and are already enabled in the Deployment.
#   5. Encrypt in place:         sops --encrypt --in-place gitops/romm/romm-secret.enc.yaml
#
# Afterwards every stringData value reads ENC[AES256_GCM,...] and the file is safe to commit.
# Edit later with:  sops gitops/romm/romm-secret.enc.yaml
#
# 🔑 If this ever lands in git in plaintext: rotate the DB + Redis passwords and regenerate the
#    auth key (that logs everyone out), then redo step 5. See docs/sops-argocd.md, Phase 8.
apiVersion: v1
kind: Secret
metadata:
  name: romm-secret
  namespace: media
  labels:
    app: romm
type: Opaque
stringData:
  ROMM_AUTH_SECRET_KEY: "REPLACE_ME_openssl_rand_hex_32"
  DB_PASSWD: "REPLACE_ME_FROM_postgres-romm-setup"
  REDIS_PASSWORD: "REPLACE_ME_VALKEY_ACL_PASSWORD"
  # ── optional metadata providers (https://docs.romm.app/latest/getting-started/metadata-providers/) ──
  IGDB_CLIENT_ID: ""              # Twitch dev app — best general metadata
  IGDB_CLIENT_SECRET: ""
  SCREENSCRAPER_USER: ""          # recommended: great for retro platforms + box art
  SCREENSCRAPER_PASSWORD: ""
  RETROACHIEVEMENTS_API_KEY: ""   # achievements + hashes
  STEAMGRIDDB_API_KEY: ""         # alternate artwork
