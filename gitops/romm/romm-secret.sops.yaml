# KSOPS generator — decrypts romm-secret.enc.yaml into the `romm-secret` Secret at Argo
# render time (same pattern as gitops/komf and gitops/immich/prereqs).
apiVersion: viaduct.ai/v1
kind: ksops

metadata:
  name: romm-secret
  namespace: media
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops

files:
  - ./romm-secret.enc.yaml
