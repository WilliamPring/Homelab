# ============================================================
# Homepage ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: apps
  labels:
    app: homepage

data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean

    layout:
      Apps:
        style: row
        columns: 4

      Monitoring:
        style: row
        columns: 3

      Infrastructure:
        style: row
        columns: 1

  services.yaml: |
    - Apps:
        - Vaultwarden:
            href: https://vault.williampring.ca
            description: Password manager
            icon: vaultwarden.png

        - Immich:
            href: https://immich.williampring.ca
            description: Photo backup
            icon: immich.png

        - SearXNG:
            href: https://private.williampring.ca
            description: Private metasearch
            icon: searxng.png

        - degoog:
            href: https://search.williampring.ca
            description: Search aggregator
            icon: si-google

    - Monitoring:
        - Grafana:
            href: https://grafana.williampring.ca
            description: Logs & metrics
            icon: grafana.png

        - Argo CD:
            href: https://argocd.williampring.ca
            description: GitOps deployments
            icon: si-argo

    - Infrastructure:
        - Pulse:
            href: http://192.168.68.104:7655
            description: Proxmox management
            widget:
              type: iframe
              name: Pulse
              src: http://192.168.68.104:7655
              classes: h-96 sm:h-60 md:h-60 lg:h-auto xl:h-auto 2xl:h-auto # optional, use tailwind height classes, see https://tailwindcss.com/docs/height

              span: 6

              referrerPolicy: same-origin # optional, no default

              allowPolicy: autoplay; fullscreen; gamepad # optional, no default

              allowFullscreen: true # optional, default: true

              loadingStrategy: eager # optional, default: eager

              allowScrolling: yes # optional, default: yes

              refreshInterval: 2000 # optional, no default

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /

    - search:
        provider: custom
        url: https://search.williampring.ca/search?q=
        target: _blank

    - openmeteo:
        label: Toronto
        latitude: 43.6532
        longitude: -79.3832
        timezone: America/Toronto
        units: metric

  bookmarks.yaml: |
    - Homelab:
        - Repo:
            - abbr: GH
              href: https://github.com/WilliamPring/Homelab

        - Sub Proxmox (masterk3s-worker):
            - abbr: PVE
              href: https://192.168.68.96:8006

        - Main Proxmox (worker):
            - abbr: PVE
              href: https://192.168.68.89:8006
