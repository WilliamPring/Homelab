# ============================================================
# Homepage ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: apps
  labels:
    app: homepage

data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean

    layout:
      Apps:
        style: row
        columns: 4

      Monitoring:
        style: row
        columns: 2

      Infrastructure:
        style: row
        columns: 1

  services.yaml: |
    - Apps:
        - Immich:
            href: https://immich.williampring.ca
            description: Photo backup
            icon: immich.png

        - SearXNG:
            href: https://private.williampring.ca
            description: Private metasearch
            icon: searxng.png

        - degoog:
            href: https://search.williampring.ca
            description: Search aggregator
            icon: si-google

        - Library:
            href: https://library.williampring.ca
            description: Manga & books (Kavita)
            icon: kavita.png

        - Books:
            href: https://books.williampring.ca
            description: Ebook ingest & metadata (Calibre-Web)
            icon: calibre-web.png

        - Games:
            href: https://roms.williampring.ca
            description: ROM library & in-browser play (RomM)
            icon: romm.png

    - Monitoring:
        - Argo CD:
            href: https://argocd.williampring.ca
            description: GitOps deployments
            icon: si-argo

    - Infrastructure:
        - Pulse:
            href: https://pulse.williampring.ca/
            description: Proxmox management
            widget:
              type: iframe
              name: Pulse
              src: https://pulse.williampring.ca/
              referrerPolicy: same-origin # optional, no default
              allowPolicy: autoplay; fullscreen; gamepad # optional, no default
              allowFullscreen: true # optional, default: true
              loadingStrategy: eager # optional, default: eager
              allowScrolling: yes # optional, default: yes

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /

    - search:
        provider: custom
        url: https://search.williampring.ca/search?q=
        target: _blank

    - openmeteo:
        label: Toronto
        latitude: 43.6532
        longitude: -79.3832
        timezone: America/Toronto
        units: metric

  bookmarks.yaml: |
    - Homelab:
        - Repo:
            - abbr: GH
              href: https://github.com/WilliamPring/Homelab

        - Sub Proxmox (masterk3s-worker):
            - abbr: PVE
              href: https://192.168.68.96:8006

        - Main Proxmox (worker):
            - abbr: PVE
              href: https://192.168.68.89:8006
