# Kavita — one app for manga/comics (CBZ/CBR) AND ebooks (EPUB/PDF). Reader + progress
# sync + OPDS + scrobbling. Uses its EMBEDDED DB (in /config) — no external Postgres.
#
# Two content mounts:
#   /library  → NFS /data/library  (manga, comics — Komf fills in the metadata, see gitops/komf)
#   /books    → the CALIBRE library (read-only). Calibre-Web-Automated ingests + fixes book
#               metadata; Kavita just reads the finished EPUBs. Add it as a "Book" library.
#
# Image is PINNED (Renovate can bump it). LSIO tag format: version-v<kavita version>.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: media
  labels:
    app: kavita
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO config volume + single instance
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
    spec:
      containers:
        - name: kavita
          image: lscr.io/linuxserver/kavita:version-v0.9.1.4   # LSIO image (PUID/PGID)
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Vancouver"
          ports:
            - containerPort: 5000     # Kavita's web UI / OPDS port
          volumeMounts:
            - name: config
              mountPath: /config      # embedded DB + settings
            - name: library
              mountPath: /library     # manga/comics (NFS) — add libraries at /library/manga, /library/comics
            - name: books
              mountPath: /books       # the Calibre library (NFS, RO) — add as a "Book" library
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita-config
        - name: library
          persistentVolumeClaim:
            claimName: kavita-library
        - name: books
          persistentVolumeClaim:
            claimName: calibre-books   # shared RWX claim owned by gitops/calibre (same namespace)
            readOnly: true
