# Kavita — one app for manga/comics (CBZ/CBR) AND ebooks (EPUB/PDF). Reader + progress
# sync + OPDS + scrobbling. Uses its EMBEDDED DB (in /config) — no external Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: media
  labels:
    app: kavita
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO config volume + single instance
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
    spec:
      containers:
        - name: kavita
          image: lscr.io/linuxserver/kavita:latest   # LSIO image (PUID/PGID) — pin a tag later
          env:
            - name: PUID
              value: "1000"           # must match /data/manga ownership on the file server
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Vancouver"
          ports:
            - containerPort: 5000     # Kavita's web UI / OPDS port
          volumeMounts:
            - name: config
              mountPath: /config      # embedded DB + settings
            - name: library
              mountPath: /library     # all content (NFS) — add libraries at /library/manga, /library/books, ...
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita-config
        - name: library
          persistentVolumeClaim:
            claimName: kavita-library
