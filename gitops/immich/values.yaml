# Helm values for Immich (immich-app/immich-charts — bjw-s common-library based) — GitOps copy.
# Argo feeds this to the chart via the Application's valueFiles ($values/gitops/immich/values.yaml).
#
# ⚠️ STRUCTURE MATTERS for this chart:
#   env  → controllers.main.containers.main.env   (NOT a top-level env:)
#   lib  → immich.persistence.library
# Redis auto-wires to <release>-valkey when valkey.enabled: true.

# Immich version = chart DEFAULT (appVersion v3.0.0) — no image.tag pin.
# ⚠️ If the cluster is currently running 3.1, deploying this is a DOWNGRADE to 3.0.0.
#    Immich does NOT support downgrades across a DB migration — 3.0.0 may refuse to start
#    against a 3.1-migrated database. BACK UP Postgres + the library before syncing, and
#    check the running version first (see docs/immich.md / the notes below).

# Pin ALL Immich pods to the labeled 32GB worker (heavy: ML + storage).
# ⚠️ The 'immich-node: true' label must exist on the worker (hand/Ansible — not a manifest).
defaultPodOptions:
  nodeSelector:
    immich-node: "true"

# Photo library → the pre-created NFS-backed PVC (gitops/immich/prereqs/library.yaml).
immich:
  persistence:
    library:
      existingClaim: immich-library

# Let the chart deploy + auto-wire Valkey (Redis). REDIS_HOSTNAME → immich-valkey.
valkey:
  enabled: true

# Environment — connect to the EXTERNAL vector Postgres (gitops/immich/prereqs/postgres.yaml).
# MUST live here (controllers.main.containers.main.env) for this chart to apply it.
# DB_PASSWORD comes from the hand-managed immich-db Secret (out of git, must exist in media).
controllers:
  main:
    containers:
      main:
        env:
          DB_HOSTNAME: immich-postgres
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: password
  # -------------------------------------------------------------------
  # Machine Learning service
  # -------------------------------------------------------------------
  machine-learning:
    enabled: true
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v2.3.1
              pullPolicy: IfNotPresent
            env:
              TRANSFORMERS_CACHE: /cache
              HF_XET_CACHE: /cache/huggingface-xet
              MPLCONFIGDIR: /cache/matplotlib-config
    persistence:
      cache:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: immich-mlcache-pvc
        accessMode: ReadWriteOnce

  # -------------------------------------------------------------------
