# Pin all Immich pods to the labeled 32GB worker.
defaultPodOptions:
  nodeSelector:
    immich-node: "true"


# Photo library → the pre-created NFS-backed PVC (gitops/immich/prereqs/library.yaml).
immich:
  persistence:
    library:
      existingClaim: immich-library

# Let the chart deploy + auto-wire Valkey (Redis). REDIS_HOSTNAME → immich-valkey.
valkey:
  enabled: false


# Environment — connect to the EXTERNAL vector Postgres (gitops/immich/prereqs/postgres.yaml).
# MUST live here (controllers.main.containers.main.env) for this chart to apply it.
# DB_PASSWORD comes from the hand-managed immich-db Secret (out of git, must exist in media).
controllers:
  # Immich server
  main:
    containers:
      main:
        env:
          DB_HOSTNAME: immich-postgres
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: password
          REDIS_HOSTNAME: "192.168.68.103" 
          REDIS_PORT: "6379" 
          REDIS_USERNAME: "redis" 
          REDIS_PASSWORD: "7jDtb86VyDd155XM7KHg4UNlahRVyl4s"
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "6"
            memory: "8Gi"

