# Existing Immich PostgreSQL — DO NOT CHANGE DURING MIGRATION
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: media
  labels:
    app: immich-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      nodeSelector:
        immich-node: "true"
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: immich-postgres-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data
  namespace: media
  labels:
    app: immich-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: media
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432

# NEW PG16 migration PVC
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data-v16
  namespace: media
  labels:
    app: immich-postgres
    migration: postgres-v16
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

# TEMPORARY PG16 migration database
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres-v16-migration
  namespace: media
  labels:
    app: immich-postgres-v16-migration
    migration: postgres-v16
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres-v16-migration
  template:
    metadata:
      labels:
        app: immich-postgres-v16-migration
    spec:
      nodeSelector:
        immich-node: "true"
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: immich-postgres-data-v16
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi