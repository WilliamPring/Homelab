# Immich's vector Postgres — the chart does NOT create this. Immich REQUIRES this exact
# image (pgvecto.rs / VectorChord extension), not vanilla Postgres. Keep the tag in sync
# with Immich's docker-compose (it changes across releases).
#
# The immich-db Secret (POSTGRES_PASSWORD) is NOT here — it's hand/Ansible-managed so the
# password stays out of git. It must already exist in the 'media' namespace.
# The 'immich-node: true' node label must also exist (set by hand / Ansible on the worker).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: media
  labels:
    app: immich-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      nodeSelector:
        immich-node: "true"      # pin to the labeled 32GB worker (heavy app)
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: immich-postgres-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres-data
  namespace: media
  labels:
    app: immich-postgres
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: media
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432
