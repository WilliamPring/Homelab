# ⚠️ PLAINTEXT TEMPLATE — NOT YET ENCRYPTED. Do these two steps on the Arch box (it has the
# age key) BEFORE committing, or Argo's KSOPS step will fail to decrypt it:
#
#   1. Paste the real key:   Kavita → avatar (top-right) → Settings → "3rd Party Clients"
#                             → API Key. Replace REPLACE_ME_WITH_KAVITA_API_KEY below.
#   2. Encrypt in place:      sops --encrypt --in-place gitops/komf/komf-secret.enc.yaml
#                             (.sops.yaml at repo root matches *.enc.yaml → uses your age key)
#
# Afterwards `stringData.KAVITA_API_KEY` is ciphertext and the file is safe to commit.
# To change it later:  sops gitops/komf/komf-secret.enc.yaml   (decrypt → edit → re-encrypt)
#
# 🔑 If you ever commit this file with the real key in plaintext, ROTATE it: Kavita →
#    3rd Party Clients → "Reset API Key", then redo steps 1–2 (see docs/sops-argocd.md, Phase 8).
apiVersion: v1
kind: Secret
metadata:
  name: komf-secret
  namespace: media
  labels:
    app: komf
type: Opaque
stringData:
  KAVITA_API_KEY: "REPLACE_ME_WITH_KAVITA_API_KEY"
