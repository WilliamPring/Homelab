# KSOPS generator — decrypts komf-secret.enc.yaml into the real `komf-secret` at Argo
# render time (same pattern as gitops/immich/prereqs/immich-secret.sops.yaml).
apiVersion: viaduct.ai/v1
kind: ksops

metadata:
  name: komf-secret
  namespace: media
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops

files:
  - ./komf-secret.enc.yaml
