# Alloy (grafana/alloy chart) — the log SHIPPER. GitOps copy (fed via valueFiles).
# Runs as a DaemonSet (one per node), discovers all pods, tails their logs, pushes to Loki.

controller:
  type: daemonset          # one Alloy pod per node → sees every node's pod logs

alloy:
  # Alloy's pipeline config (River syntax): discover pods → label them → ship to Loki.
  configMap:
    content: |-
      // 1. discover every pod in the cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. turn k8s metadata into useful Loki labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      // 3. tail the logs of those pods (via the k8s API)
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      // 4. push everything to Loki's HTTP service
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
